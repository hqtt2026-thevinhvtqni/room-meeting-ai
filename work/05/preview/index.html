<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROOM-HOP Work Preview</title><style>body{margin:0;background:#f6f7f9;color:#1b1f24;font:14px system-ui}main{max-width:1100px;margin:auto;padding:18px 12px}button{background:white;border:1px solid #dde2e8;border-radius:8px;padding:7px 12px;margin:8px 6px 8px 0}table{border-collapse:collapse;width:100%;background:white}td,th{border:1px solid #dde2e8;padding:6px;text-align:left}.card{background:white;border:1px solid #dde2e8;border-radius:8px;padding:10px;margin:8px 0}</style><main><h1 id=t>Đang tải…</h1><div id=s></div><nav id=n></nav><section id=v></section></main><script src=product-render.js></script><script>(async()=>{try{let[c,d]=await Promise.all([fetch("preview.config.json").then(r=>r.json()),fetch("data.json").then(r=>r.json())]);t.textContent=c.title;s.textContent="work "+d.meta.work_id+" · "+d.meta.data_mode;c.screens.forEach((x,i)=>{let b=document.createElement("button");b.textContent=x.label;b.onclick=()=>{v.textContent="";PreviewRenderers[x.renderer](v,d)};n.appendChild(b);if(!i)b.click()})}catch(e){v.textContent="Lỗi preview: "+e.message}})()</script>
