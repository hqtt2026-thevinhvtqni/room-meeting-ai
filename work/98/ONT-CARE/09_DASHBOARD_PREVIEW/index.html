<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONT Care — Product Preview</title>
<style>
:root{color-scheme:light;--ink:#182230;--muted:#687587;--line:#e1e7ee;--surface:#fff;--bg:#f3f6fa;--blue:#2359a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#10253f;color:#fff;padding:22px clamp(16px,4vw,48px)}header .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:0}header p{color:#c6d3e3;margin:5px 0 0}.tag{border:1px solid #b8cbe3;border-radius:999px;padding:5px 10px;font-size:12px;letter-spacing:.04em}
nav{display:flex;gap:8px;overflow:auto;padding:12px clamp(12px,4vw,48px);background:#fff;border-bottom:1px solid var(--line)}button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 13px;color:var(--ink);font:inherit;cursor:pointer}button[aria-selected=true]{background:#eaf1fc;border-color:#9db9e6;color:#174a91;font-weight:700}main{max-width:1400px;margin:auto;padding:24px clamp(12px,4vw,48px) 48px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:#55708f}.section-title{margin:18px 0 12px}.section-title h2{font-size:18px;margin:0}.section-title p{margin:3px 0 0}.notice{padding:13px 15px;border:1px solid var(--line);border-left:4px solid #d09a27;border-radius:10px;background:#fff;margin:12px 0 18px}.notice p{margin:4px 0 0}.notice-info{border-left-color:#3977cb}.notice-warn{border-left-color:#d09a27}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 20px}.metric,.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.metric{display:flex;flex-direction:column;gap:4px}.metric-value{font-size:26px;line-height:1.2}.content-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}.panel .section-title{margin-top:0}.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;background:#fff}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f7f9fc;color:#536174;font-size:12px}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#edf0f4;color:#586273}.pill-good{background:#e3f6eb;color:#176a3a}.pill-warn{background:#fff2d9;color:#8a5a00}.pill-bad{background:#fde8e7;color:#a12724}.pill-info{background:#e5efff;color:#2359a8}.phone-frame{max-width:410px;margin:20px auto;border:8px solid #17283e;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 12px 35px #16283e18}.phone-hero{background:#eaf2ff;padding:24px}.phone-hero h2{margin:7px 0}.phone-body{padding:16px;display:grid;gap:12px}.phone-body .metric{padding:12px}.phone-body .metric-value{font-size:20px}.phone-body .notice{margin:0}.footer{margin-top:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:800px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid{grid-template-columns:1fr}header{padding:18px 16px}h1{font-size:21px}main{padding-top:16px}.panel{padding:12px}}
</style>
</head>
<body>
<header><div class="top"><div><div class="eyebrow" style="color:#a9c7f0">WORK 98 · ONT CARE</div><h1>Product Preview</h1><p>Giao diện xem trước sản phẩm và bằng chứng build/test</p></div><span class="tag">MOCK DATA · BUILD BLOCKED</span></div></header>
<nav id="nav" aria-label="Preview sections"></nav>
<main><div id="view" aria-live="polite"></div><div class="footer">Sandbox preview · Dữ liệu demo không phải thiết bị thật · Build/E2E chỉ được đánh PASS khi có log thực thi.</div></main>
<script src="product-render.js"></script>
<script>
(async()=>{const nav=document.getElementById('nav'),view=document.getElementById('view');try{const [c,d]=await Promise.all([fetch('preview.config.json').then(r=>r.json()),fetch('data.json').then(r=>r.json())]);document.querySelector('header .tag').textContent=d.meta.data_mode+' DATA · '+d.meta.build_status;function show(s,b){view.replaceChildren();window.PreviewRenderers[s.renderer](view,d);[...nav.children].forEach((x,i)=>x.setAttribute('aria-selected',String(i===b)))}c.screens.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.label;b.setAttribute('aria-selected',String(i===0));b.onclick=()=>show(s.renderer,i);nav.append(b);if(i===0)show(s.renderer,i)});}catch(e){view.textContent='Không tải được preview: '+e.message;}}</script>
</body></html>
