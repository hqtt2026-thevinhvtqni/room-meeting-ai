name: ROOM HOP CI Hardening

on:
  push:
    branches:
      - work/32-ci-cd-python-ci-v2
      - 'work/32-ci-*'
  pull_request:
    branches:
      - main
      - work/32-ci-cd-python-ci-v2
  workflow_dispatch:

permissions:
  contents: read

# Only PR runs are cancelled when superseded; push/dispatch runs finish so
# every exact-SHA run keeps its evidence artifact.
concurrency:
  group: room-hop-ci-hardening-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  W32_DIR: work/32/CI-CD-ROOM-HOP-PYTHON-NO-DOCKER
  UNIT_TESTS: >-
    tests/test_agent_registry.py
    tests/test_connectors.py
    tests/test_context_loader.py
    tests/test_discussion.py
    tests/test_file_ops_agent.py
    tests/test_governance.py
    tests/test_identity.py
    tests/test_importer.py
    tests/test_intent_router.py
    tests/test_llama_intent_router.py
    tests/test_meeting_lifecycle_v021.py
    tests/test_meeting.py
    tests/test_meeting_manager_allocator.py
    tests/test_meeting_service.py
    tests/test_message_v1.py
    tests/test_secretary.py
    tests/test_secretary_acceptance_abc.py
    tests/test_secretary_meeting_acceptance.py
    tests/test_f4_resource_limits.py
    tests/test_browser_agent_adapter_runner.py
  E2E_TESTS: >-
    tests/test_e2e.py
    tests/test_execution_host.py
    tests/test_wee_8031_bridge.py
    tests/test_mcp_server.py
    tests/test_http_lifecycle.py
    tests/test_http_recording.py
    tests/test_ci_live_e2e.py
    tests/test_ci_mcp_stdio_e2e.py
    tests/test_browser_agent_adapter_contract.py
    tests/test_browser_agent_adapter_stdio_e2e.py
    tests/test_ci_product_e2e.py
    tests/test_integration.py
    tests/test_work13_wee_integration.py
  WINDOWS_LANE_TESTS: >-
    tests/test_browser_agent_adapter_e2e.py

jobs:
  unit:
    name: Python 3.12 compile and bounded unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          mkdir -p test-results
          python -m pip freeze > test-results/pip-freeze-unit.txt

      - name: Compile application packages
        run: python -m compileall -q core agents execution_host room_hop_mcp

      - name: Report tests not run by any CI job (report-only unless CHECK_STRICT=1)
        run: |
          set -o pipefail
          REPO_ROOT="$PWD" python "${W32_DIR}/04_CODE/ci_tools/check_test_coverage.py" | tee test-results/test-coverage-report.txt

      - name: Run bounded deterministic unit tests
        run: |
          python -m pytest -q ${UNIT_TESTS} --junitxml=test-results/junit-unit.xml

      - name: Retain unit test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-unit
          path: |
            test-results/junit-unit.xml
            test-results/pip-freeze-unit.txt
            test-results/test-coverage-report.txt
          if-no-files-found: warn
          retention-days: 14

  tooling:
    name: Work 32 tooling tests (classifier, coverage and workflow mirror)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run tooling tests (stdlib unittest, no third-party dependencies)
        run: |
          set -o pipefail
          mkdir -p test-results
          cd "${W32_DIR}/05_TEST"
          python -m unittest -v test_result_classifier test_check_test_coverage test_check_workflow_mirror 2>&1 | tee "${GITHUB_WORKSPACE}/test-results/tooling-unittest.txt"

      - name: Check active workflow and Work 32 mirror (report-only)
        run: |
          set -o pipefail
          python "${W32_DIR}/04_CODE/ci_tools/check_workflow_mirror.py" | tee test-results/workflow-mirror-report.txt

      - name: Retain tooling test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-tooling
          path: test-results/tooling-unittest.txt
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Product Auto E2E (live HTTP + MCP stdio + persisted evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          mkdir -p test-results
          python -m pip freeze > test-results/pip-freeze-e2e.txt

      - name: Compile application packages
        run: python -m compileall -q core agents execution_host room_hop_mcp

      - name: Run auto E2E suites
        run: |
          python -m pytest -v ${E2E_TESTS} --junitxml=test-results/junit-e2e.xml

      - name: Retain E2E test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-e2e
          path: |
            test-results/junit-e2e.xml
            test-results/pip-freeze-e2e.txt
          if-no-files-found: warn
          retention-days: 14

  windows_browser_adapter:
    name: Windows Browser Adapter E2E (runner-owned disposable fixture)
    if: \${{ vars.W32_WINDOWS_RUNNER_READY == 'true' }}
    runs-on: [self-hosted, Windows, X64, room-hop-w32]
    timeout-minutes: 15
    env:
      ROOMHOP_TEST_MODE: "1"
      ROOMHOP_MCP_TIMEOUT_SECONDS: "30"
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: \${{ github.repository }}
          REVISION: \${{ github.sha }}
        shell: pwsh
        run: |
          git init .
          git remote add origin "https://github.com/$env:REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$env:REVISION"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install application and browser dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m pip install -r requirements.txt -c constraints-ci.txt
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: application dependency install failed" }
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: Playwright install failed" }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: Chromium provisioning failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: pip dependency check failed" }
          python -m pip freeze | Out-File -FilePath test-results/windows-pip-freeze.txt -Encoding utf8

      - name: Create unique disposable Core meeting fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $store = Join-Path $env:RUNNER_TEMP "roomhop-w32-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $meetingId = "MEETING-W32-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python scripts/w32_windows_fixture.py --store "$store" --meeting-id "$meetingId" --identity-id "xu" --runner-temp "$env:RUNNER_TEMP" --workspace "$env:GITHUB_WORKSPACE" | Tee-Object -FilePath test-results/windows-fixture-setup.txt
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: disposable Core fixture creation failed" }
          @"
ROOMHOP_TEST_MEETINGS_DIR=$store
ROOMHOP_TEST_MEETING_ID=$meetingId
ROOMHOP_TEST_IDENTITY_ID=xu
"@ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launch exact-SHA Browser Adapter and verify ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pythonExe = (Get-Command python -ErrorAction Stop).Source
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = [int]$listener.LocalEndpoint.Port
          $listener.Stop()
          $env:ROOMHOP_BROWSER_ADAPTER_PORT = "$port"
          "ROOMHOP_BROWSER_ADAPTER_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $stdout = Join-Path $env:GITHUB_WORKSPACE "test-results\browser-adapter.stdout.log"
          $stderr = Join-Path $env:GITHUB_WORKSPACE "test-results\browser-adapter.stderr.log"
          $quotedStore = '"' + $env:ROOMHOP_TEST_MEETINGS_DIR + '"'
          $arguments = @("-m", "room_hop_mcp.browser_agent_adapter.runner", "--source-sha", $env:GITHUB_SHA, "--meetings-dir", $quotedStore, "--port", "$port")
          $proc = Start-Process -FilePath $pythonExe -ArgumentList $arguments -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $createdUtc = $proc.StartTime.ToUniversalTime().ToString("o")
          @"
W32_ADAPTER_PID=$($proc.Id)
W32_ADAPTER_CREATED_UTC=$createdUtc
W32_ADAPTER_EXE=$pythonExe
W32_ADAPTER_PARENT_PID=$PID
"@ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $procInfo = Get-CimInstance Win32_Process -Filter "ProcessId = $($proc.Id)"
          if (-not $procInfo -or -not $procInfo.ExecutablePath -or -not $procInfo.CommandLine) { throw "BLOCKED: launched adapter process provenance is incomplete" }
          if ([IO.Path]::GetFullPath($procInfo.ExecutablePath) -ne [IO.Path]::GetFullPath($pythonExe)) { throw "BLOCKED: launched adapter executable differs from selected Python" }
          if ($procInfo.ParentProcessId -ne $PID) { throw "BLOCKED: adapter is not a direct child of this job step" }
          foreach ($expected in @("room_hop_mcp.browser_agent_adapter.runner", $env:GITHUB_SHA, $env:ROOMHOP_TEST_MEETINGS_DIR, "--port $port")) {
            if (-not $procInfo.CommandLine.Contains($expected)) { throw "BLOCKED: adapter command line is missing expected provenance: $expected" }
          }
          $currentProcess = Get-CimInstance Win32_Process -Filter "ProcessId = $PID"
          $currentOwnerResult = Invoke-CimMethod -InputObject $currentProcess -MethodName GetOwner
          $adapterOwnerResult = Invoke-CimMethod -InputObject $procInfo -MethodName GetOwner
          if ($currentOwnerResult.ReturnValue -ne 0 -or $adapterOwnerResult.ReturnValue -ne 0) { throw "BLOCKED: runner or adapter owner could not be resolved" }
          $currentOwner = "$($currentOwnerResult.Domain)\$($currentOwnerResult.User)"
          $adapterOwner = "$($adapterOwnerResult.Domain)\$($adapterOwnerResult.User)"
          if ($adapterOwner -ne $currentOwner) { throw "BLOCKED: adapter owner differs from the runner job identity" }
          $deadline = (Get-Date).AddSeconds(30)
          $healthy = $false
          do {
            Start-Sleep -Milliseconds 500
            if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) { throw "BLOCKED: adapter process exited before health became ready" }
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/health" -TimeoutSec 2
              if ($health.ok -eq $true) { $healthy = $true; break }
            } catch { }
          } while ((Get-Date) -lt $deadline)
          if (-not $healthy) { throw "BLOCKED: adapter /health did not become ready within 30 seconds" }
          $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
          if ($listeners.Count -ne 1 -or $listeners[0].OwningProcess -ne $proc.Id -or $listeners[0].LocalAddress -ne "127.0.0.1") { throw "BLOCKED: selected port is not owned by exactly one adapter loopback listener" }
          @"
runner=$env:COMPUTERNAME
source_sha=$env:GITHUB_SHA
adapter_port=$port
adapter_pid=$($procInfo.ProcessId)
adapter_owner=$adapterOwner
adapter_executable=$($procInfo.ExecutablePath)
adapter_parent_pid=$($procInfo.ParentProcessId)
adapter_command_line=$($procInfo.CommandLine)
fixture_store=$env:ROOMHOP_TEST_MEETINGS_DIR
fixture_meeting=$env:ROOMHOP_TEST_MEETING_ID
fixture_identity=$env:ROOMHOP_TEST_IDENTITY_ID
health=PASS
listener=PASS
"@ | Out-File -FilePath test-results/windows-preflight.txt -Encoding utf8

      - name: Run deterministic local Browser Adapter E2E
        shell: pwsh
        run: |
          python -m pytest -v tests/test_browser_agent_adapter_e2e.py --junitxml=test-results/junit-browser-adapter-windows.xml
          if ($LASTEXITCODE -ne 0) { throw "Windows Browser Adapter E2E failed" }

      - name: Verify disposable store and retain inventory
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $store = $env:ROOMHOP_TEST_MEETINGS_DIR
          if (-not $store) { throw "BLOCKED: disposable store path was not exported" }
          $sentinel = Join-Path $store ".roomhop-disposable-test-store"
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) { throw "BLOCKED: disposable-store sentinel is missing after test" }
          $marker = (Get-Content -LiteralPath $sentinel -Raw).Trim()
          if ($marker -ne "ROOM-HOP-WORK32-DISPOSABLE-TEST-STORE") { throw "BLOCKED: disposable-store sentinel changed" }
          Get-ChildItem -LiteralPath $store -Force -Recurse | Sort-Object FullName | ForEach-Object { "{0}|{1}" -f $_.FullName.Substring($store.Length), $(if ($_.PSIsContainer) { "DIR" } else { $_.Length }) } | Out-File -FilePath test-results/windows-fixture-inventory.txt -Encoding utf8

      - name: Stop only the adapter process created by this job
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:W32_ADAPTER_PID) { Write-Host "adapter_cleanup=NOT_REQUIRED (process was not started)"; exit 0 }
          $adapterPid = [int]$env:W32_ADAPTER_PID
          $procInfo = Get-CimInstance Win32_Process -Filter "ProcessId = $adapterPid" -ErrorAction SilentlyContinue
          if ($procInfo) {
            $created = $procInfo.CreationDate.ToUniversalTime().ToString("o")
            if ($created -ne $env:W32_ADAPTER_CREATED_UTC -or [IO.Path]::GetFullPath($procInfo.ExecutablePath) -ne [IO.Path]::GetFullPath($env:W32_ADAPTER_EXE) -or $procInfo.ParentProcessId -ne [int]$env:W32_ADAPTER_PARENT_PID) { throw "BLOCKED: process identity changed; refusing to stop PID $adapterPid" }
            $owner = Invoke-CimMethod -InputObject $procInfo -MethodName GetOwner
            if ($owner.ReturnValue -ne 0) { throw "BLOCKED: adapter owner cannot be revalidated; refusing to stop PID $adapterPid" }
            $actualOwner = "$($owner.Domain)\$($owner.User)"
            $current = Get-CimInstance Win32_Process -Filter "ProcessId = $PID"
            $currentOwnerResult = Invoke-CimMethod -InputObject $current -MethodName GetOwner
            $currentOwner = "$($currentOwnerResult.Domain)\$($currentOwnerResult.User)"
            if ($actualOwner -ne $currentOwner) { throw "BLOCKED: adapter owner differs from runner identity; refusing to stop PID $adapterPid" }
            Stop-Process -Id $adapterPid -Force
            Wait-Process -Id $adapterPid -Timeout 10 -ErrorAction SilentlyContinue
          }
          if ($env:ROOMHOP_BROWSER_ADAPTER_PORT) {
            $remaining = @(Get-NetTCPConnection -State Listen -LocalPort ([int]$env:ROOMHOP_BROWSER_ADAPTER_PORT) -ErrorAction SilentlyContinue)
            if ($remaining.Count -gt 0) { throw "BLOCKED: listener remains after owned adapter cleanup; no unrelated process was stopped" }
          }
          Write-Host "adapter_cleanup=PASS"

      - name: Upload Windows Browser Adapter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-windows-browser-adapter
          path: |
            test-results/windows-*.txt
            test-results/browser-adapter.*.log
            test-results/junit-browser-adapter-windows.xml
            room_hop_mcp/browser_agent_adapter/evidence/**
          if-no-files-found: warn
          retention-days: 14

  release_gate:
    name: Work 32 release acceptance gate
    if: always()
    needs: [unit, tooling, e2e, windows_browser_adapter, product_artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory lanes
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          WINDOWS_RESULT: ${{ needs.windows_browser_adapter.result }}
          ARTIFACT_RESULT: ${{ needs.product_artifact.result }}
        run: |
          printf 'unit=%s\ntooling=%s\ne2e=%s\nwindows_browser_adapter=%s\nproduct_artifact=%s\n' "$UNIT_RESULT" "$TOOLING_RESULT" "$E2E_RESULT" "$WINDOWS_RESULT" "$ARTIFACT_RESULT"
          test "$UNIT_RESULT" = success
          test "$TOOLING_RESULT" = success
          test "$E2E_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$ARTIFACT_RESULT" = success

  product_artifact:
    name: Build and verify immutable ROOM HOP product artifact
    needs: [unit, e2e, tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPOSITORY: ${{ github.repository }}
      REVISION: ${{ github.sha }}
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build immutable source artifact and checksum
        run: |
          mkdir -p dist product
          BUNDLE="room-hop-${REVISION}.tar.gz"
          git archive --format=tar.gz --prefix="room-hop-${REVISION}/" "${REVISION}" > "dist/${BUNDLE}"
          cd dist
          sha256sum "${BUNDLE}" | tee "${BUNDLE}.sha256"
          sha256sum --check "${BUNDLE}.sha256"
          cd ..

      - name: Install dependencies and verify extracted product artifact
        run: |
          BUNDLE="room-hop-${REVISION}.tar.gz"
          tar -xzf "dist/${BUNDLE}" -C product
          cd "product/room-hop-${REVISION}"
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          python -m compileall -q core agents execution_host room_hop_mcp
          mkdir -p test-results
          python -m pytest -q tests/test_ci_product_e2e.py --junitxml=test-results/junit-product-artifact.xml

      - name: Retain immutable product artifact, checksum and artifact-level E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-product-release-candidate
          path: |
            dist/room-hop-${{ github.sha }}.tar.gz
            dist/room-hop-${{ github.sha }}.tar.gz.sha256
            product/room-hop-${{ github.sha }}/test-results/junit-product-artifact.xml
          if-no-files-found: warn
          retention-days: 14
