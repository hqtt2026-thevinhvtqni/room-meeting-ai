<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROOM-HOP Computer Agent</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:24px}
.card{border:1px solid #ccc;border-radius:12px;padding:16px;margin:12px 0}
#status{font-weight:700}
button{padding:10px 14px;margin-right:8px}
pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h1>ROOM-HOP Computer Agent</h1>
<div class="card">
  <div>Agent API: <span id="status">CHECKING…</span></div>
  <button onclick="checkHealth()">Refresh</button>
</div>
<div class="card">
  <h2>Task</h2>
  <textarea id="task" rows="4" style="width:100%" placeholder="Mô tả task cho Computer Agent"></textarea>
  <button onclick="executeTask()">Execute</button>
</div>
<div class="card">
  <h2>Evidence</h2>
  <pre id="evidence">Chưa có runtime evidence.</pre>
</div>
<script>
const API='http://127.0.0.1:8787';
async function checkHealth(){
  const el=document.getElementById('status');
  try{
    const r=await fetch(API+'/health');
    const d=await r.json();
    el.textContent=d.status==='ok'?'CONNECTED':'BLOCKED';
  }catch(e){el.textContent='OFFLINE';}
}
async function executeTask(){
  const task=document.getElementById('task').value.trim();
  if(!task)return;
  const out=document.getElementById('evidence');
  try{
    const r=await fetch(API+'/agent/execute',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({task})
    });
    out.textContent=JSON.stringify(await r.json(),null,2);
  }catch(e){out.textContent=JSON.stringify({status:'BLOCKED',error:String(e)},null,2);}
}
checkHealth();
</script>
</body>
</html>
