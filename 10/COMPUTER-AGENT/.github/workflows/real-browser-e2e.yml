name: Work 10 Real Browser E2E

on:
  push:
    branches:
      - work-10-sandbox-handoff-20261006
  workflow_dispatch:

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Syntax check
        run: |
          python -m py_compile 04_CODE/*.py 05_TEST/e2e_real_browser.py

      - name: Offline contract tests
        run: python 05_TEST/test_p0_p5.py

      - name: Real Chromium E2E
        run: python 05_TEST/e2e_real_browser.py

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work10-real-browser-evidence
          path: |
            06_EVIDENCE/real-browser-e2e-result.json
            06_EVIDENCE/real-browser-e2e.png
          if-no-files-found: warn
