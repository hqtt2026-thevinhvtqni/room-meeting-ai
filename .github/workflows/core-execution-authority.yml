name: Core Execution Authority Contract V1.2

on:
  pull_request:
    branches: [main]
    paths:
      - "core/execution_authority.py"
      - "room_hop_mcp/adapter/execution_authority_http.py"
      - "room_hop_mcp/adapter/http_server.py"
      - "room_hop_mcp/core_http_main.py"
      - "requirements.txt"
      - "CORE_EXECUTION_AUTHORITY_V1_2_DEPLOYMENT.md"
      - "tests/test_execution_authority.py"
      - "execution_host/**"
      - "tests/test_execution_host_authority.py"
      - "tests/test_core_http_main.py"
      - "12/**"
      - "13/**"
      - ".github/workflows/core-execution-authority.yml"
  push:
    branches: [work/w1111-core-execution-authority-v1-2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt fastapi httpx
      - run: python -m pytest -q tests/test_execution_authority.py tests/test_execution_host_authority.py tests/test_core_http_main.py
      - name: W12 canonical host tests
        working-directory: 12/WORK-EXECUTION-ENVIRONMENT/04_CODE
        run: python -m pytest -q ../05_TEST/test_real_execution_host.py
      - name: W13 Core-grant bridge and W12 integration tests
        working-directory: 13/EXECUTION-HOST-INFRASTRUCTURE/04_CODE
        run: python -m pytest -q ../05_TEST/test_wee_8031_bridge.py ../05_TEST/test_core_grant_host_integration.py
