name: ROOM HOP CI Hardening

on:
  push:
    branches:
      - work/32-ci-cd-python-ci-v2
      - 'work/32-ci-*'
  pull_request:
    branches:
      - main
      - work/32-ci-cd-python-ci-v2
  workflow_dispatch:

permissions:
  contents: read

# Only PR runs are cancelled when superseded; push/dispatch runs finish so
# every exact-SHA run keeps its evidence artifact.
concurrency:
  group: room-hop-ci-hardening-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  W32_DIR: work/32/CI-CD-ROOM-HOP-PYTHON-NO-DOCKER
  UNIT_TESTS: >-
    tests/test_agent_registry.py
    tests/test_connectors.py
    tests/test_context_loader.py
    tests/test_discussion.py
    tests/test_file_ops_agent.py
    tests/test_governance.py
    tests/test_identity.py
    tests/test_importer.py
    tests/test_intent_router.py
    tests/test_llama_intent_router.py
    tests/test_meeting_lifecycle_v021.py
    tests/test_meeting.py
    tests/test_meeting_manager_allocator.py
    tests/test_meeting_service.py
    tests/test_message_v1.py
    tests/test_secretary.py
    tests/test_secretary_acceptance_abc.py
    tests/test_secretary_meeting_acceptance.py
    tests/test_f4_resource_limits.py
  E2E_TESTS: >-
    tests/test_e2e.py
    tests/test_execution_host.py
    tests/test_wee_8031_bridge.py
    tests/test_mcp_server.py
    tests/test_http_lifecycle.py
    tests/test_http_recording.py
    tests/test_ci_live_e2e.py
    tests/test_ci_mcp_stdio_e2e.py
    tests/test_browser_agent_adapter_contract.py
    tests/test_browser_agent_adapter_stdio_e2e.py
    tests/test_ci_product_e2e.py
    tests/test_browser_agent_adapter_port_config.py
    tests/test_integration.py
    tests/test_work13_wee_integration.py
  WINDOWS_LANE_TESTS: >-
    tests/test_browser_agent_adapter_e2e.py

jobs:
  unit:
    name: Python 3.12 compile and bounded unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          mkdir -p test-results
          python -m pip freeze > test-results/pip-freeze-unit.txt

      - name: Compile application packages
        run: python -m compileall -q core agents execution_host room_hop_mcp

      - name: Report tests not run by any CI job (report-only unless CHECK_STRICT=1)
        run: |
          set -o pipefail
          REPO_ROOT="$PWD" python "${W32_DIR}/04_CODE/ci_tools/check_test_coverage.py" | tee test-results/test-coverage-report.txt

      - name: Run bounded deterministic unit tests
        run: |
          python -m pytest -q ${UNIT_TESTS} --junitxml=test-results/junit-unit.xml

      - name: Retain unit test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-unit
          path: |
            test-results/junit-unit.xml
            test-results/pip-freeze-unit.txt
            test-results/test-coverage-report.txt
          if-no-files-found: warn
          retention-days: 14

  tooling:
    name: Work 32 tooling tests (classifier, coverage and workflow mirror)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run tooling tests (stdlib unittest, no third-party dependencies)
        run: |
          set -o pipefail
          mkdir -p test-results
          cd "${W32_DIR}/05_TEST"
          python -m unittest -v test_result_classifier test_check_test_coverage test_check_workflow_mirror 2>&1 | tee "${GITHUB_WORKSPACE}/test-results/tooling-unittest.txt"

      - name: Check active workflow and Work 32 mirror (report-only)
        run: |
          set -o pipefail
          python "${W32_DIR}/04_CODE/ci_tools/check_workflow_mirror.py" | tee test-results/workflow-mirror-report.txt

      - name: Retain tooling test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-tooling
          path: test-results/tooling-unittest.txt
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Product Auto E2E (live HTTP + MCP stdio + persisted evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          mkdir -p test-results
          python -m pip freeze > test-results/pip-freeze-e2e.txt

      - name: Compile application packages
        run: python -m compileall -q core agents execution_host room_hop_mcp

      - name: Run auto E2E suites
        run: |
          python -m pytest -v ${E2E_TESTS} --junitxml=test-results/junit-e2e.xml

      - name: Retain E2E test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-e2e
          path: |
            test-results/junit-e2e.xml
            test-results/pip-freeze-e2e.txt
          if-no-files-found: warn
          retention-days: 14

  windows_browser_adapter:
    name: Windows Browser Adapter E2E (runner-owned disposable fixture)
    if: ${{ vars.W32_WINDOWS_RUNNER_READY == 'true' }}
    runs-on: [self-hosted, Windows, X64, room-hop-w32]
    timeout-minutes: 20
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          git init .
          git remote add origin "https://$env:REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$env:REVISION"
          git checkout --detach FETCH_HEAD
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            throw "BLOCKED: checkout does not match GITHUB_SHA"
          }

      - name: Install runner-local portable Python 3.12
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "scripts\w32_install_python_runtime.ps1"
          & $installer

      - name: Install Work32 runtime and provision Chromium
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:W32_PYTHON_SITE_PACKAGES)) { throw "BLOCKED: embedded Python site-packages path was not exported" }
          & $env:W32_PYTHON_EXE -m pip install --target $env:W32_PYTHON_SITE_PACKAGES -r requirements.txt -c constraints-ci.txt
          & $env:W32_PYTHON_EXE -m pip check
          $browserPath = Join-Path $env:RUNNER_TEMP "playwright-browsers"
          New-Item -ItemType Directory -Force $browserPath | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = $browserPath
          "PLAYWRIGHT_BROWSERS_PATH=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $env:W32_PYTHON_EXE -m playwright install chromium
          New-Item -ItemType Directory -Force test-results | Out-Null
          & $env:W32_PYTHON_EXE -m pip freeze | Out-File -FilePath test-results/pip-freeze-windows.txt -Encoding utf8

      - name: Create per-run disposable Core meeting and dynamic loopback port
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          & $env:W32_PYTHON_EXE scripts/w32_windows_browser_adapter_fixture.py 2>&1 | Tee-Object -FilePath test-results/windows-fixture-provision.log
          if ($LASTEXITCODE -ne 0) {
            throw "BLOCKED: disposable Core fixture provisioning failed (exit $LASTEXITCODE)"
          }
          if (-not (Test-Path -LiteralPath $env:GITHUB_ENV -PathType Leaf)) {
            throw "BLOCKED: GITHUB_ENV was not available after fixture provisioning"
          }

      - name: Run runner-owned Browser Adapter lifecycle, preflight and deterministic E2E
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $adapterPid = $null
          $processCreatedUtc = $null
          $adapterExe = $null
          $adapterOwner = $null
          $adapterParentPid = $null
          $store = $env:ROOMHOP_TEST_MEETINGS_DIR
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE -ErrorAction Stop).Path
          $port = [int]$env:ROOMHOP_BROWSER_ADAPTER_PORT
          $python = $env:W32_PYTHON_EXE
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE "scripts\w32_browser_adapter_bootstrap.py"
          $meeting = $env:ROOMHOP_TEST_MEETING_ID
          $identity = $env:ROOMHOP_TEST_IDENTITY_ID
          $stdout = Join-Path $env:GITHUB_WORKSPACE "test-results\browser-adapter.stdout.log"
          $stderr = Join-Path $env:GITHUB_WORKSPACE "test-results\browser-adapter.stderr.log"
          New-Item -ItemType Directory -Force (Split-Path -Parent $stdout) | Out-Null

          try {
            foreach ($value in @($python, $store, $meeting, $identity, $env:ROOMHOP_BROWSER_ADAPTER_URL)) {
              if ([string]::IsNullOrWhiteSpace($value)) { throw "BLOCKED: runtime or fixture environment is incomplete" }
            }
            $resolvedStore = (Resolve-Path -LiteralPath $store -ErrorAction Stop).Path
            if ($resolvedStore.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
              throw "BLOCKED: disposable store must be outside GITHUB_WORKSPACE"
            }
            $sentinel = Join-Path $resolvedStore ".roomhop-disposable-test-store"
            if ((Get-Content -LiteralPath $sentinel -Raw -ErrorAction Stop).Trim() -ne "ROOM-HOP-WORK32-DISPOSABLE-TEST-STORE") {
              throw "BLOCKED: disposable-store sentinel is invalid"
            }

            $argumentLine = '"{0}" --source-sha "{1}" --meetings-dir "{2}" --meeting-id "{3}" --identity-id "{4}" --port "{5}"' -f $bootstrap, $env:GITHUB_SHA, $resolvedStore, $meeting, $identity, $port
            $started = Start-Process -FilePath $python -ArgumentList $argumentLine -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -WindowStyle Hidden
            if (-not $started -or $started.Id -le 0) { throw "BLOCKED: Browser Adapter process did not start" }
            $adapterPid = [int]$started.Id

            $process = Get-CimInstance Win32_Process -Filter "ProcessId = $adapterPid"
            if (-not $process -or -not $process.ExecutablePath -or -not $process.CommandLine) {
              throw "BLOCKED: started process provenance is incomplete"
            }
            $ownerResult = Invoke-CimMethod -InputObject $process -MethodName GetOwner
            if ($ownerResult.ReturnValue -ne 0) { throw "BLOCKED: cannot resolve adapter process owner" }
            $adapterOwner = "$($ownerResult.Domain)\$($ownerResult.User)"
            $runnerProcess = Get-CimInstance Win32_Process -Filter "ProcessId = $PID"
            if (-not $runnerProcess) { throw "BLOCKED: current runner shell process is unavailable" }
            $runnerOwnerResult = Invoke-CimMethod -InputObject $runnerProcess -MethodName GetOwner
            if ($runnerOwnerResult.ReturnValue -ne 0) { throw "BLOCKED: cannot resolve runner shell owner" }
            $runnerOwner = "$($runnerOwnerResult.Domain)\$($runnerOwnerResult.User)"
            if ($adapterOwner -ne $runnerOwner) { throw "BLOCKED: adapter is not owned by the current runner job identity" }
            $adapterExe = $process.ExecutablePath
            $adapterParentPid = [int]$process.ParentProcessId
            $processCreatedUtc = $process.CreationDate.ToUniversalTime().ToString("o")

            Write-Host "adapter_pid=$adapterPid"
            Write-Host "adapter_owner=$adapterOwner"
            Write-Host "adapter_executable=$adapterExe"
            Write-Host "adapter_parent_pid=$adapterParentPid"
            Write-Host "source_sha=$env:GITHUB_SHA"
            Write-Host "store=$resolvedStore"
            Write-Host "port=$port"

            $health = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $process = Get-CimInstance Win32_Process -Filter "ProcessId = $adapterPid"
              if (-not $process) { throw "BLOCKED: exact adapter process exited before health preflight" }
              $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue | Where-Object { $_.LocalAddress -eq "127.0.0.1" -and $_.OwningProcess -eq $adapterPid })
              if ($listeners.Count -gt 1) { throw "BLOCKED: adapter PID owns multiple configured loopback listeners" }
              try {
                $health = Invoke-RestMethod -Uri "$env:ROOMHOP_BROWSER_ADAPTER_URL/health" -TimeoutSec 2
                if ($health.ok -and [int]$health.port -eq $port -and $listeners.Count -eq 1) { break }
              } catch { Start-Sleep -Seconds 1 }
              if ($attempt -lt 29) { Start-Sleep -Seconds 1 }
            }

            $process = Get-CimInstance Win32_Process -Filter "ProcessId = $adapterPid"
            if (-not $process -or -not $process.ExecutablePath -or -not $process.CommandLine) {
              throw "BLOCKED: exact adapter process is absent or provenance is incomplete"
            }
            if (-not [string]::Equals([IO.Path]::GetFullPath($process.ExecutablePath), [IO.Path]::GetFullPath($adapterExe), [StringComparison]::OrdinalIgnoreCase)) {
              throw "BLOCKED: adapter executable differs from started executable"
            }
            if ($process.CommandLine -notlike "*$env:GITHUB_SHA*" -or $process.CommandLine -notlike "*$resolvedStore*" -or $process.CommandLine -notlike "*w32_browser_adapter_bootstrap.py*") {
              throw "BLOCKED: process command line does not attest bootstrap, exact SHA and disposable store"
            }
            if ($process.ParentProcessId -ne $adapterParentPid -or $process.CreationDate.ToUniversalTime().Ticks -ne ([datetime]::Parse($processCreatedUtc).ToUniversalTime().Ticks)) {
              throw "BLOCKED: adapter process identity changed during preflight"
            }
            $ownerResult = Invoke-CimMethod -InputObject $process -MethodName GetOwner
            $actualOwner = if ($ownerResult.ReturnValue -eq 0) { "$($ownerResult.Domain)\$($ownerResult.User)" } else { "" }
            if ($actualOwner -ne $adapterOwner) { throw "BLOCKED: adapter process owner changed" }
            $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue | Where-Object { $_.LocalAddress -eq "127.0.0.1" -and $_.OwningProcess -eq $adapterPid })
            if ($listeners.Count -ne 1 -or -not $health -or -not $health.ok -or [int]$health.port -ne $port) {
              throw "BLOCKED: exact PID listener and health did not confirm configured port"
            }

            @{
              repository = $env:GITHUB_REPOSITORY
              run_id = $env:GITHUB_RUN_ID
              attempt = $env:GITHUB_RUN_ATTEMPT
              source_sha = $env:GITHUB_SHA
              store = $resolvedStore
              sentinel = $sentinel
              meeting_id = $meeting
              identity_id = $identity
              port = $port
              pid = $adapterPid
              executable = $process.ExecutablePath
              owner = $actualOwner
              parent_pid = $process.ParentProcessId
              health = $health
              lifecycle = "single-step"
            } | ConvertTo-Json -Depth 6 | Set-Content -Path test-results/windows-preflight.json -Encoding utf8
            Write-Host "windows_preflight=PASS pid=$adapterPid port=$port source_sha=$env:GITHUB_SHA"

            & $python -m pytest -v tests/test_browser_agent_adapter_port_config.py tests/test_browser_agent_adapter_e2e.py --junitxml=test-results/junit-browser-adapter-windows.xml
            if ($LASTEXITCODE -ne 0) { throw "BLOCKED: deterministic Browser Adapter E2E failed (pytest exit $LASTEXITCODE)" }
            Write-Host "windows_browser_adapter_e2e=PASS"
          }
          finally {
            if ($store -and (Test-Path -LiteralPath $store -PathType Container)) {
              $sentinel = Join-Path $store ".roomhop-disposable-test-store"
              if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf) -or (Get-Content -LiteralPath $sentinel -Raw).Trim() -ne "ROOM-HOP-WORK32-DISPOSABLE-TEST-STORE") {
                throw "BLOCKED: disposable-store sentinel missing or altered after E2E"
              }
              Get-ChildItem -LiteralPath $store -Recurse -File | ForEach-Object {
                $_.FullName.Substring($store.Length).TrimStart('\')
              } | Set-Content -Path test-results/windows-store-inventory.txt -Encoding utf8
            }
            if ($adapterPid) {
              $process = Get-CimInstance Win32_Process -Filter "ProcessId = $adapterPid"
              if ($process) {
                $sameStart = $process.CreationDate.ToUniversalTime().Ticks -eq ([datetime]::Parse($processCreatedUtc).ToUniversalTime().Ticks)
                $sameExe = [string]::Equals([IO.Path]::GetFullPath($process.ExecutablePath), [IO.Path]::GetFullPath($adapterExe), [StringComparison]::OrdinalIgnoreCase)
                $sameParent = $process.ParentProcessId -eq $adapterParentPid
                $ownerResult = Invoke-CimMethod -InputObject $process -MethodName GetOwner
                $sameOwner = $ownerResult.ReturnValue -eq 0 -and "$($ownerResult.Domain)\$($ownerResult.User)" -eq $adapterOwner
                if (-not ($sameStart -and $sameExe -and $sameParent -and $sameOwner)) {
                  throw "BLOCKED: refusing to stop PID because process identity no longer matches this run"
                }
                try {
                  Invoke-RestMethod -Method Post -Uri "$env:ROOMHOP_BROWSER_ADAPTER_URL/browser/close" -TimeoutSec 5 | Out-Null
                  Write-Host "browser_context_cleanup=PASS"
                } catch {
                  Write-Warning "Browser close endpoint unavailable; terminating only the verified job-owned adapter process."
                }
                Stop-Process -Id $adapterPid -Force
                Wait-Process -Id $adapterPid -Timeout 10 -ErrorAction SilentlyContinue
                if (Get-CimInstance Win32_Process -Filter "ProcessId = $adapterPid") {
                  throw "BLOCKED: job-owned Browser Adapter did not terminate"
                }
                Write-Host "adapter_cleanup=PASS pid=$adapterPid"
              } else {
                Write-Host "adapter_cleanup=PROCESS_ALREADY_EXITED pid=$adapterPid"
              }
            }
          }

      - name: Upload Windows Browser Adapter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-windows-browser-adapter
          path: |
            test-results/**
            room_hop_mcp/browser_agent_adapter/evidence/**
          if-no-files-found: warn
          retention-days: 14

  release_gate:
    name: Work 32 release acceptance gate
    if: always()
    needs: [unit, tooling, e2e, windows_browser_adapter, product_artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory lanes
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          WINDOWS_RESULT: ${{ needs.windows_browser_adapter.result }}
          ARTIFACT_RESULT: ${{ needs.product_artifact.result }}
        run: |
          printf 'unit=%s\ntooling=%s\ne2e=%s\nwindows_browser_adapter=%s\nproduct_artifact=%s\n' "$UNIT_RESULT" "$TOOLING_RESULT" "$E2E_RESULT" "$WINDOWS_RESULT" "$ARTIFACT_RESULT"
          test "$UNIT_RESULT" = success
          test "$TOOLING_RESULT" = success
          test "$E2E_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$ARTIFACT_RESULT" = success

  product_artifact:
    name: Build and verify immutable ROOM HOP product artifact
    needs: [unit, e2e, tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPOSITORY: ${{ github.repository }}
      REVISION: ${{ github.sha }}
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build immutable source artifact and checksum
        run: |
          mkdir -p dist product
          BUNDLE="room-hop-${REVISION}.tar.gz"
          git archive --format=tar.gz --prefix="room-hop-${REVISION}/" "${REVISION}" > "dist/${BUNDLE}"
          cd dist
          sha256sum "${BUNDLE}" | tee "${BUNDLE}.sha256"
          sha256sum --check "${BUNDLE}.sha256"
          cd ..

      - name: Install dependencies and verify extracted product artifact
        run: |
          BUNDLE="room-hop-${REVISION}.tar.gz"
          tar -xzf "dist/${BUNDLE}" -C product
          cd "product/room-hop-${REVISION}"
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          python -m compileall -q core agents execution_host room_hop_mcp
          mkdir -p test-results
          python -m pytest -q tests/test_ci_product_e2e.py --junitxml=test-results/junit-product-artifact.xml

      - name: Retain immutable product artifact, checksum and artifact-level E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-product-release-candidate
          path: |
            dist/room-hop-${{ github.sha }}.tar.gz
            dist/room-hop-${{ github.sha }}.tar.gz.sha256
            product/room-hop-${{ github.sha }}/test-results/junit-product-artifact.xml
          if-no-files-found: warn
          retention-days: 14
