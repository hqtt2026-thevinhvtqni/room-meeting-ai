name: ROOM HOP CI Hardening

on:
  push:
    branches:
      - work/32-ci-cd-python-ci-v2
      - 'work/32-ci-*'
  pull_request:
    branches:
      - main
      - work/32-ci-cd-python-ci-v2
  workflow_dispatch:

permissions:
  contents: read

# Only PR runs are cancelled when superseded; push/dispatch runs finish so
# every exact-SHA run keeps its evidence artifact.
concurrency:
  group: room-hop-ci-hardening-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  W32_DIR: work/32/CI-CD-ROOM-HOP-PYTHON-NO-DOCKER
  UNIT_TESTS: >-
    tests/test_agent_registry.py
    tests/test_connectors.py
    tests/test_context_loader.py
    tests/test_discussion.py
    tests/test_file_ops_agent.py
    tests/test_governance.py
    tests/test_identity.py
    tests/test_importer.py
    tests/test_intent_router.py
    tests/test_llama_intent_router.py
    tests/test_meeting_lifecycle_v021.py
    tests/test_meeting.py
    tests/test_meeting_manager_allocator.py
    tests/test_meeting_service.py
    tests/test_message_v1.py
    tests/test_secretary.py
    tests/test_secretary_acceptance_abc.py
    tests/test_secretary_meeting_acceptance.py
    tests/test_f4_resource_limits.py
  E2E_TESTS: >-
    tests/test_e2e.py
    tests/test_execution_host.py
    tests/test_wee_8031_bridge.py
    tests/test_mcp_server.py
    tests/test_http_lifecycle.py
    tests/test_http_recording.py
    tests/test_ci_live_e2e.py
    tests/test_ci_mcp_stdio_e2e.py
    tests/test_browser_agent_adapter_contract.py
    tests/test_browser_agent_adapter_stdio_e2e.py
    tests/test_ci_product_e2e.py
    tests/test_integration.py
    tests/test_work13_wee_integration.py
  WINDOWS_LANE_TESTS: >-
    tests/test_browser_agent_adapter_e2e.py

jobs:
  unit:
    name: Python 3.12 compile and bounded unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          mkdir -p test-results
          python -m pip freeze > test-results/pip-freeze-unit.txt

      - name: Compile application packages
        run: python -m compileall -q core agents execution_host room_hop_mcp

      - name: Report tests not run by any CI job (report-only unless CHECK_STRICT=1)
        run: |
          set -o pipefail
          REPO_ROOT="$PWD" python "${W32_DIR}/04_CODE/ci_tools/check_test_coverage.py" | tee test-results/test-coverage-report.txt

      - name: Run bounded deterministic unit tests
        run: |
          python -m pytest -q ${UNIT_TESTS} --junitxml=test-results/junit-unit.xml

      - name: Retain unit test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-unit
          path: |
            test-results/junit-unit.xml
            test-results/pip-freeze-unit.txt
            test-results/test-coverage-report.txt
          if-no-files-found: warn
          retention-days: 14

  tooling:
    name: Work 32 tooling tests (classifier, coverage and workflow mirror)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run tooling tests (stdlib unittest, no third-party dependencies)
        run: |
          set -o pipefail
          mkdir -p test-results
          cd "${W32_DIR}/05_TEST"
          python -m unittest -v test_result_classifier test_check_test_coverage test_check_workflow_mirror 2>&1 | tee "${GITHUB_WORKSPACE}/test-results/tooling-unittest.txt"

      - name: Check active workflow and Work 32 mirror (strict)
        run: |
          set -o pipefail
          CHECK_STRICT=1 python "${W32_DIR}/04_CODE/ci_tools/check_workflow_mirror.py" | tee test-results/workflow-mirror-report.txt

      - name: Retain tooling test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-tooling
          path: test-results/tooling-unittest.txt
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Product Auto E2E (live HTTP + MCP stdio + persisted evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          mkdir -p test-results
          python -m pip freeze > test-results/pip-freeze-e2e.txt

      - name: Compile application packages
        run: python -m compileall -q core agents execution_host room_hop_mcp

      - name: Run auto E2E suites
        run: |
          python -m pytest -v ${E2E_TESTS} --junitxml=test-results/junit-e2e.xml

      - name: Retain E2E test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-e2e
          path: |
            test-results/junit-e2e.xml
            test-results/pip-freeze-e2e.txt
          if-no-files-found: warn
          retention-days: 14

  windows_browser_adapter:
    name: Windows Browser Adapter E2E (job-owned disposable runner)
    if: ${{ vars.W32_WINDOWS_RUNNER_READY == 'true' }}
    runs-on: [self-hosted, Windows, X64, room-hop-w32]
    timeout-minutes: 20
    env:
      PSExecutionPolicyPreference: Bypass
      ROOMHOP_TEST_MODE: "1"
      ROOMHOP_TEST_MEETING_ID: MEETING-W32-DISPOSABLE
      ROOMHOP_TEST_IDENTITY_ID: vinh
    steps:
      - name: Add installed PowerShell 7 to this job PATH
        shell: cmd
        run: echo C:\Program Files\PowerShell\7>>"%GITHUB_PATH%"

      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        shell: 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}'
        run: |
          git init .
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: git init failed in Work32 workspace" }
          $origin = git remote get-url origin 2>$null
          if ($LASTEXITCODE -eq 0 -and $origin) {
            git remote set-url origin "https://github.com/$env:REPOSITORY.git"
          } else {
            git remote add origin "https://github.com/$env:REPOSITORY.git"
          }
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: could not configure Work32 origin remote" }
          git fetch --no-tags --depth=1 origin "$env:REVISION"
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: exact triggering revision fetch failed" }
          git clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: could not clean only the Work32 checkout workspace" }
          git checkout --force --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: detached checkout failed" }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:REVISION) { throw "BLOCKED: checkout SHA mismatch" }

      - name: Provision isolated portable Python 3.12.9 x64
        shell: 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}'
        run: |
          $pythonRoot = Join-Path $env:RUNNER_TEMP ("w32-python-3.12.9-" + $env:GITHUB_SHA)
          $archive = Join-Path $env:RUNNER_TEMP "python-3.12.9-embed-amd64.zip"
          $download = "https://www.python.org/ftp/python/3.12.9/python-3.12.9-embed-amd64.zip"
          Invoke-WebRequest -Uri $download -OutFile $archive
          if (-not (Test-Path -LiteralPath $archive)) { throw "BLOCKED: official Python embeddable archive download failed" }
          $archiveBytes = (Get-Item -LiteralPath $archive).Length
          if ($archiveBytes -ne 11098289) { throw "BLOCKED: unexpected Python embeddable archive size: $archiveBytes" }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Path $pythonRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $pythonRoot -Force
          $python = Join-Path $pythonRoot "python.exe"
          $pth = Join-Path $pythonRoot "python312._pth"
          if (-not (Test-Path -LiteralPath $python) -or -not (Test-Path -LiteralPath $pth)) { throw "BLOCKED: embedded Python package layout is incomplete" }
          $pthLines = @(Get-Content -LiteralPath $pth)
          if ($pthLines -notcontains "Lib\site-packages") { $pthLines += "Lib\site-packages" }
          $pthLines = @($pthLines | ForEach-Object { if ($_ -eq "#import site") { "import site" } else { $_ } })
          if ($pthLines -notcontains "import site") { $pthLines += "import site" }
          Set-Content -LiteralPath $pth -Value $pthLines -Encoding ascii
          New-Item -ItemType Directory -Path (Join-Path $pythonRoot "Lib\site-packages") -Force | Out-Null
          $getPip = Join-Path $env:RUNNER_TEMP "get-pip-w32-$env:GITHUB_SHA.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          if (-not (Test-Path -LiteralPath $getPip)) { throw "BLOCKED: pip bootstrap download failed" }
          & $python $getPip --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "BLOCKED: pip bootstrap failed for embedded Python" }
          $details = & $python -c 'import sys,struct; print("%d.%d.%d|%d|%s" % (sys.version_info[0],sys.version_info[1],sys.version_info[2],struct.calcsize("P")*8,sys.executable))'
          if ($LASTEXITCODE -ne 0 -or $details -notmatch "^3\.12\.9\|64\|") { throw "BLOCKED: portable Python version/architecture verification failed: $details" }
          $browserRoot = Join-Path $env:RUNNER_TEMP ("w32-playwright-browsers-" + $env:GITHUB_SHA)
          foreach ($line in @("W32_PYTHON=$python", "W32_PYTHON_ROOT=$pythonRoot", "PLAYWRIGHT_BROWSERS_PATH=$browserRoot")) {
            [IO.File]::AppendAllText($env:GITHUB_ENV, $line + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))
          }
          Write-Host "portable_python=$details"
          Write-Host "python_archive_bytes=$archiveBytes"
          Write-Host "python_archive_sha256=$archiveHash"
          Write-Host "python_install_root=$pythonRoot"

      - name: Install pinned Browser Adapter dependencies and Chromium
        shell: 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}'
        run: |
          & $env:W32_PYTHON -m pip install -r requirements.txt -c constraints-ci.txt
          if ($LASTEXITCODE -ne 0) { throw "project dependency install failed" }
          & $env:W32_PYTHON -m pip install pytest requests playwright==1.65.0
          if ($LASTEXITCODE -ne 0) { throw "Windows E2E dependency install failed" }
          & $env:W32_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check failed" }
          & $env:W32_PYTHON -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium install failed" }
          $version = (& $env:W32_PYTHON -c "import importlib.metadata as m; print(m.version('playwright'))").Trim()
          if ($version -ne "1.65.0") { throw "Unexpected Playwright version: $version" }
          New-Item -ItemType Directory -Force test-results | Out-Null
          & $env:W32_PYTHON -m pip freeze | Out-File test-results/pip-freeze-browser-windows.txt -Encoding utf8

      - name: Create isolated Core meeting fixture and select shared port
        shell: 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}'
        run: |
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $runnerTemp = (Resolve-Path $env:RUNNER_TEMP).Path
          if ($runnerTemp.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw "RUNNER_TEMP is inside checkout" }
          $store = Join-Path $runnerTemp ("w32-browser-store-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $store -ErrorAction Stop | Out-Null
          $store = (Resolve-Path $store).Path
          $sentinel = Join-Path $store ".roomhop-disposable-test-store"
          [IO.File]::WriteAllText($sentinel, "ROOM-HOP-WORK32-DISPOSABLE-TEST-STORE", (New-Object System.Text.UTF8Encoding($false)))
          $tcp = New-Object System.Net.Sockets.TcpListener([Net.IPAddress]::Loopback, 0)
          $tcp.Start()
          $port = $tcp.LocalEndpoint.Port
          $tcp.Stop()
          foreach ($line in @("ROOMHOP_TEST_MEETINGS_DIR=$store", "ROOM_HOP_MEETINGS_DIR=$store", "ROOMHOP_BROWSER_ADAPTER_PORT=$port")) {
            [IO.File]::AppendAllText($env:GITHUB_ENV, $line + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))
          }
          & $env:W32_PYTHON tests/support/bootstrap_browser_adapter_fixture.py --store "$store" --workspace "$workspace"
          if ($LASTEXITCODE -ne 0) { throw "Core meeting fixture bootstrap failed" }
          Write-Host "fixture_store=$store port=$port meeting=$env:ROOMHOP_TEST_MEETING_ID"

      - name: Start exact-checkout Browser Adapter and verify owned listener
        shell: 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}'
        run: |
          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $store = (Resolve-Path $env:ROOMHOP_TEST_MEETINGS_DIR).Path
          $port = [int]$env:ROOMHOP_BROWSER_ADAPTER_PORT
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne $env:GITHUB_SHA) { throw "Source SHA changed before adapter launch" }
          $wrapper = Join-Path $env:RUNNER_TEMP "w32-browser-adapter-$sha.py"
          $source = @'
          import argparse, os, sys
          p = argparse.ArgumentParser()
          p.add_argument("--store", required=True)
          p.add_argument("--sha", required=True)
          p.add_argument("--port", required=True, type=int)
          p.add_argument("--workspace", required=True)
          p.add_argument("--app", required=True)
          a = p.parse_args()
          os.environ.update({"ROOM_HOP_MEETINGS_DIR": a.store, "ROOMHOP_TEST_MEETINGS_DIR": a.store,
                             "ROOMHOP_TEST_MODE": "1", "ROOMHOP_SOURCE_SHA": a.sha,
                             "ROOMHOP_BROWSER_ADAPTER_PORT": str(a.port)})
          sys.path.insert(0, a.workspace)
          import uvicorn
          uvicorn.run(a.app, host="127.0.0.1", port=a.port)
          '@
          Set-Content -LiteralPath $wrapper -Value $source -Encoding ascii
          $stdout = Join-Path $env:RUNNER_TEMP "w32-browser-adapter-$sha.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "w32-browser-adapter-$sha.stderr.log"
          $python = $env:W32_PYTHON
          $startArgs = @{ FilePath=$python; PassThru=$true; WorkingDirectory=$workspace; ArgumentList=@("-u",$wrapper,"--store",$store,"--sha",$sha,"--port","$port","--workspace",$workspace,"--app","room_hop_mcp.browser_agent_adapter.adapter:app"); RedirectStandardOutput=$stdout; RedirectStandardError=$stderr }
          $proc = Start-Process @startArgs
          if (-not $proc) { throw "Adapter process did not start" }
          $metadataPath = Join-Path $env:RUNNER_TEMP "w32-browser-adapter-process.json"
          $preMeta = [ordered]@{ pid=$proc.Id; executable=[IO.Path]::GetFullPath($python); owner=[Security.Principal.WindowsIdentity]::GetCurrent().Name; store=$store; port=$port; sha=$sha; wrapper=$wrapper }
          $preMeta | ConvertTo-Json | Set-Content -LiteralPath $metadataPath -Encoding utf8
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ROOMHOP_ADAPTER_METADATA=$metadataPath" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))
          $deadline = (Get-Date).AddSeconds(90)
          $health = $null
          while ((Get-Date) -lt $deadline) {
            $live = Get-CimInstance Win32_Process -Filter "ProcessId = $($proc.Id)" -ErrorAction SilentlyContinue
            if (-not $live) { break }
            try { $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 3; if ($health) { break } } catch { Start-Sleep -Seconds 2 }
          }
          $owned = Get-CimInstance Win32_Process -Filter "ProcessId = $($proc.Id)" -ErrorAction SilentlyContinue
          if (-not $owned -or -not $owned.ExecutablePath -or -not $owned.CommandLine) { throw "Adapter process provenance unavailable" }
          if ($owned.CommandLine -notlike "*$wrapper*" -or $owned.CommandLine -notlike "*$store*" -or $owned.CommandLine -notlike "*$sha*" -or $owned.CommandLine -notlike "*room_hop_mcp.browser_agent_adapter.adapter:app*") { throw "Adapter command line provenance mismatch" }
          $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction Stop | Where-Object { $_.OwningProcess -eq $proc.Id -and $_.LocalAddress -eq "127.0.0.1" })
          if ($listeners.Count -ne 1) { throw "Listener is not owned by job-created PID" }
          if (-not $health) { Get-Content $stderr -ErrorAction SilentlyContinue; throw "Adapter health probe failed" }
          $ownerResult = Invoke-CimMethod -InputObject $owned -MethodName GetOwner
          if ($ownerResult.ReturnValue -ne 0) { throw "Cannot establish adapter process owner" }
          $owner = "$($ownerResult.Domain)\$($ownerResult.User)"
          if ($owner -ne [Security.Principal.WindowsIdentity]::GetCurrent().Name) { throw "Adapter owner differs from runner job identity" }
          $meta = [ordered]@{ pid=$proc.Id; executable=[IO.Path]::GetFullPath($owned.ExecutablePath); owner=$owner; command_line=$owned.CommandLine; store=$store; port=$port; sha=$sha; wrapper=$wrapper }
          $meta | ConvertTo-Json | Set-Content -LiteralPath $metadataPath -Encoding utf8
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ROOMHOP_ADAPTER_METADATA=$metadataPath" + [Environment]::NewLine, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "adapter_pid=$($proc.Id) owner=$owner sha=$sha health=$($health | ConvertTo-Json -Compress)"

      - name: Run Browser Adapter live E2E
        shell: 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}'
        run: |
          & $env:W32_PYTHON -m pytest -v tests/test_browser_agent_adapter_e2e.py --junitxml=test-results/junit-browser-adapter-windows.xml
          if ($LASTEXITCODE -ne 0) { throw "Browser Adapter live E2E failed" }

      - name: Stop only the process created by this job and remove disposable store
        if: always()
        shell: 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}'
        run: |
          $metadataPath = $env:ROOMHOP_ADAPTER_METADATA
          if ($metadataPath -and (Test-Path $metadataPath -PathType Leaf)) {
            $meta = Get-Content $metadataPath -Raw | ConvertFrom-Json
            $proc = Get-CimInstance Win32_Process -Filter "ProcessId = $($meta.pid)" -ErrorAction SilentlyContinue
            if ($proc) {
              $sameExe = [string]::Equals([IO.Path]::GetFullPath($proc.ExecutablePath), [IO.Path]::GetFullPath($meta.executable), [StringComparison]::OrdinalIgnoreCase)
              $sameCommand = $proc.CommandLine -like "*$($meta.wrapper)*" -and $proc.CommandLine -like "*$($meta.store)*" -and $proc.CommandLine -like "*$($meta.sha)*"
              $ownerResult = Invoke-CimMethod -InputObject $proc -MethodName GetOwner
              $sameOwner = $ownerResult.ReturnValue -eq 0 -and "$($ownerResult.Domain)\$($ownerResult.User)" -eq $meta.owner
              if (-not ($sameExe -and $sameCommand -and $sameOwner)) { throw "Refusing to stop PID $($meta.pid): process identity changed" }
              Stop-Process -Id ([int]$meta.pid) -Force -ErrorAction Stop
              Wait-Process -Id ([int]$meta.pid) -Timeout 15 -ErrorAction SilentlyContinue
              $remaining = Get-CimInstance Win32_Process -Filter "ProcessId = $($meta.pid)" -ErrorAction SilentlyContinue
              if ($remaining) { throw "Owned adapter process did not terminate; refusing fixture-store deletion" }
            }
          }
          if ($env:ROOMHOP_TEST_MEETINGS_DIR) {
            $store = (Resolve-Path $env:ROOMHOP_TEST_MEETINGS_DIR -ErrorAction Stop).Path
            $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
            $runnerTemp = (Resolve-Path $env:RUNNER_TEMP).Path
            if (-not $store.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase) -or $store.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw "Refusing cleanup outside runner-temp fixture" }
            $sentinel = Join-Path $store ".roomhop-disposable-test-store"
            if (-not (Test-Path $sentinel -PathType Leaf) -or (Get-Content $sentinel -Raw).Trim() -ne "ROOM-HOP-WORK32-DISPOSABLE-TEST-STORE") { throw "Refusing cleanup of unverified store" }
            Remove-Item -LiteralPath $store -Recurse -Force
            Write-Host "disposable_store_cleanup=PASS"
          }

          $workspace = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $runnerTemp = (Resolve-Path $env:RUNNER_TEMP).Path
          $runnerPrefix = $runnerTemp.TrimEnd('\\') + '\\'
          $ephemeral = @(
            $env:PLAYWRIGHT_BROWSERS_PATH,
            $env:W32_PYTHON_ROOT,
            (Join-Path $runnerTemp "python-3.12.9-embed-amd64.zip"),
            (Join-Path $runnerTemp "get-pip-w32-$env:GITHUB_SHA.py")
          )
          foreach ($candidate in $ephemeral) {
            if (-not $candidate -or -not (Test-Path -LiteralPath $candidate)) { continue }
            $resolved = (Resolve-Path -LiteralPath $candidate).Path
            if (-not $resolved.StartsWith($runnerPrefix, [StringComparison]::OrdinalIgnoreCase) -or
                $resolved.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) {
              throw "BLOCKED: refusing to clean an ephemeral path outside this job's RUNNER_TEMP"
            }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }
          Write-Host "python_and_browser_runtime_cleanup=PASS"

      - name: Retain Windows Browser Adapter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-windows-browser-adapter
          path: |
            test-results/junit-browser-adapter-windows.xml
            test-results/pip-freeze-browser-windows.txt
            ${{ runner.temp }}/w32-browser-adapter-*.stdout.log
            ${{ runner.temp }}/w32-browser-adapter-*.stderr.log
          if-no-files-found: warn
          retention-days: 14

  release_gate:
    name: Work 32 release acceptance gate
    if: always()
    needs: [unit, tooling, e2e, windows_browser_adapter, product_artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory lanes
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          WINDOWS_RESULT: ${{ needs.windows_browser_adapter.result }}
          ARTIFACT_RESULT: ${{ needs.product_artifact.result }}
        run: |
          printf 'unit=%s\ntooling=%s\ne2e=%s\nwindows_browser_adapter=%s\nproduct_artifact=%s\n' "$UNIT_RESULT" "$TOOLING_RESULT" "$E2E_RESULT" "$WINDOWS_RESULT" "$ARTIFACT_RESULT"
          test "$UNIT_RESULT" = success
          test "$TOOLING_RESULT" = success
          test "$E2E_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$ARTIFACT_RESULT" = success

  product_artifact:
    name: Build and verify immutable ROOM HOP product artifact
    needs: [unit, e2e, tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPOSITORY: ${{ github.repository }}
      REVISION: ${{ github.sha }}
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build immutable source artifact and checksum
        run: |
          mkdir -p dist product
          BUNDLE="room-hop-${REVISION}.tar.gz"
          git archive --format=tar.gz --prefix="room-hop-${REVISION}/" "${REVISION}" > "dist/${BUNDLE}"
          cd dist
          sha256sum "${BUNDLE}" | tee "${BUNDLE}.sha256"
          sha256sum --check "${BUNDLE}.sha256"
          cd ..

      - name: Install dependencies and verify extracted product artifact
        run: |
          BUNDLE="room-hop-${REVISION}.tar.gz"
          tar -xzf "dist/${BUNDLE}" -C product
          cd "product/room-hop-${REVISION}"
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          python -m compileall -q core agents execution_host room_hop_mcp
          mkdir -p test-results
          python -m pytest -q tests/test_ci_product_e2e.py --junitxml=test-results/junit-product-artifact.xml

      - name: Retain immutable product artifact, checksum and artifact-level E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-product-release-candidate
          path: |
            dist/room-hop-${{ github.sha }}.tar.gz
            dist/room-hop-${{ github.sha }}.tar.gz.sha256
            product/room-hop-${{ github.sha }}/test-results/junit-product-artifact.xml
          if-no-files-found: warn
          retention-days: 14
