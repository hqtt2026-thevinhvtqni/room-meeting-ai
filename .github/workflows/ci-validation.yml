name: ROOM HOP CI Hardening

on:
  push:
    branches:
      - work/32-ci-cd-python-ci-v2
      - 'work/32-ci-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only PR runs are cancelled when superseded; push/dispatch runs finish so
# every exact-SHA run keeps its evidence artifact.
concurrency:
  group: room-hop-ci-hardening-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  W32_DIR: work/32/CI-CD-ROOM-HOP-PYTHON-NO-DOCKER
  UNIT_TESTS: >-
    tests/test_agent_registry.py
    tests/test_connectors.py
    tests/test_context_loader.py
    tests/test_discussion.py
    tests/test_file_ops_agent.py
    tests/test_governance.py
    tests/test_identity.py
    tests/test_importer.py
    tests/test_intent_router.py
    tests/test_llama_intent_router.py
    tests/test_meeting_lifecycle_v021.py
    tests/test_meeting.py
    tests/test_meeting_manager_allocator.py
    tests/test_meeting_service.py
    tests/test_message_v1.py
    tests/test_secretary.py
    tests/test_secretary_acceptance_abc.py
    tests/test_secretary_meeting_acceptance.py
    tests/test_f4_resource_limits.py
  E2E_TESTS: >-
    tests/test_e2e.py
    tests/test_execution_host.py
    tests/test_wee_8031_bridge.py
    tests/test_mcp_server.py
    tests/test_http_lifecycle.py
    tests/test_http_recording.py
    tests/test_ci_live_e2e.py
    tests/test_ci_mcp_stdio_e2e.py
    tests/test_browser_agent_adapter_contract.py
    tests/test_browser_agent_adapter_stdio_e2e.py
    tests/test_ci_product_e2e.py
    tests/test_integration.py
    tests/test_work13_wee_integration.py
  WINDOWS_LANE_TESTS: >-
    tests/test_browser_agent_adapter_e2e.py

jobs:
  unit:
    name: Python 3.12 compile and bounded unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          mkdir -p test-results
          python -m pip freeze > test-results/pip-freeze-unit.txt

      - name: Compile application packages
        run: python -m compileall -q core agents execution_host room_hop_mcp

      - name: Report tests not run by any CI job (report-only unless CHECK_STRICT=1)
        run: |
          set -o pipefail
          REPO_ROOT="$PWD" python "${W32_DIR}/04_CODE/ci_tools/check_test_coverage.py" | tee test-results/test-coverage-report.txt

      - name: Run bounded deterministic unit tests
        run: |
          python -m pytest -q ${UNIT_TESTS} --junitxml=test-results/junit-unit.xml

      - name: Retain unit test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-unit
          path: |
            test-results/junit-unit.xml
            test-results/pip-freeze-unit.txt
            test-results/test-coverage-report.txt
          if-no-files-found: warn
          retention-days: 14

  tooling:
    name: Work 32 tooling tests (classifier, coverage and workflow mirror)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run tooling tests (stdlib unittest, no third-party dependencies)
        run: |
          set -o pipefail
          mkdir -p test-results
          cd "${W32_DIR}/05_TEST"
          python -m unittest -v test_result_classifier test_check_test_coverage test_check_workflow_mirror 2>&1 | tee "${GITHUB_WORKSPACE}/test-results/tooling-unittest.txt"

      - name: Check active workflow and Work 32 mirror (report-only)
        run: |
          set -o pipefail
          python "${W32_DIR}/04_CODE/ci_tools/check_workflow_mirror.py" | tee test-results/workflow-mirror-report.txt

      - name: Retain tooling test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-tooling
          path: test-results/tooling-unittest.txt
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Product Auto E2E (live HTTP + MCP stdio + persisted evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-ci.txt

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          mkdir -p test-results
          python -m pip freeze > test-results/pip-freeze-e2e.txt

      - name: Compile application packages
        run: python -m compileall -q core agents execution_host room_hop_mcp

      - name: Run auto E2E suites
        run: |
          python -m pytest -v ${E2E_TESTS} --junitxml=test-results/junit-e2e.xml

      - name: Retain E2E test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-e2e
          path: |
            test-results/junit-e2e.xml
            test-results/pip-freeze-e2e.txt
          if-no-files-found: warn
          retention-days: 14

  windows_browser_adapter:
    name: Windows Browser Adapter E2E (dedicated disposable runner)
    if: ${{ vars.W32_WINDOWS_RUNNER_READY == 'true' }}
    runs-on: [self-hosted, Windows, X64, room-hop-w32]
    timeout-minutes: 12
    env:
      ROOMHOP_TEST_MODE: "1"
      ROOMHOP_TEST_MEETINGS_DIR: ${{ vars.ROOMHOP_TEST_MEETINGS_DIR }}
      ROOMHOP_TEST_MEETING_ID: ${{ vars.ROOMHOP_TEST_MEETING_ID }}
      ROOMHOP_TEST_IDENTITY_ID: ${{ vars.ROOMHOP_TEST_IDENTITY_ID }}
      ROOMHOP_BROWSER_ADAPTER_PID: ${{ vars.ROOMHOP_BROWSER_ADAPTER_PID }}
      ROOMHOP_BROWSER_ADAPTER_EXE: ${{ vars.ROOMHOP_BROWSER_ADAPTER_EXE }}
      ROOMHOP_BROWSER_ADAPTER_OWNER: ${{ vars.ROOMHOP_BROWSER_ADAPTER_OWNER }}
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        shell: pwsh
        run: |
          git init .
          git remote add origin "https://github.com/$env:REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$env:REVISION"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Fail-closed Browser Adapter and disposable-store preflight
        shell: pwsh
        run: |
          $required = @(
            "ROOMHOP_TEST_MEETINGS_DIR", "ROOMHOP_TEST_MEETING_ID",
            "ROOMHOP_TEST_IDENTITY_ID", "ROOMHOP_BROWSER_ADAPTER_PID",
            "ROOMHOP_BROWSER_ADAPTER_EXE", "ROOMHOP_BROWSER_ADAPTER_OWNER"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "BLOCKED: required runner variable $name is missing"
            }
          }
          $store = (Resolve-Path -LiteralPath $env:ROOMHOP_TEST_MEETINGS_DIR -ErrorAction Stop).Path
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          if ($store.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) {
            throw "BLOCKED: disposable store must be outside GITHUB_WORKSPACE"
          }
          $sentinel = Join-Path $store ".roomhop-disposable-test-store"
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw "BLOCKED: disposable-store sentinel is missing"
          }
          $expectedPid = [int]$env:ROOMHOP_BROWSER_ADAPTER_PID
          $listeners = @(Get-NetTCPConnection -State Listen -LocalPort 8787 -ErrorAction Stop |
            Where-Object { $_.OwningProcess -eq $expectedPid -and $_.LocalAddress -eq "127.0.0.1" })
          if ($listeners.Count -ne 1) {
            throw "BLOCKED: expected PID does not own exactly one 127.0.0.1:8787 listener"
          }
          $proc = Get-CimInstance Win32_Process -Filter "ProcessId = $expectedPid"
          if (-not $proc -or -not $proc.ExecutablePath -or -not $proc.CommandLine) {
            throw "BLOCKED: process provenance is incomplete"
          }
          if (-not [string]::Equals([IO.Path]::GetFullPath($proc.ExecutablePath),
            [IO.Path]::GetFullPath($env:ROOMHOP_BROWSER_ADAPTER_EXE),
            [StringComparison]::OrdinalIgnoreCase)) {
            throw "BLOCKED: executable path does not match approved runner value"
          }
          if ($proc.CommandLine -notlike "*$store*") {
            throw "BLOCKED: service command line does not identify the disposable store"
          }
          if ($proc.CommandLine -notlike "*$env:GITHUB_SHA*") {
            throw "BLOCKED: service command line does not attest the exact source SHA"
          }
          $owner = Invoke-CimMethod -InputObject $proc -MethodName GetOwner
          $actualOwner = if ($owner.ReturnValue -eq 0) { "$($owner.Domain)\$($owner.User)" } else { "" }
          if ($actualOwner -ne $env:ROOMHOP_BROWSER_ADAPTER_OWNER) {
            throw "BLOCKED: process owner does not match approved runner value"
          }
          $parent = Get-CimInstance Win32_Process -Filter "ProcessId = $($proc.ParentProcessId)"
          if (-not $parent) { throw "BLOCKED: parent process provenance is unavailable" }
          Write-Host "runner=$env:COMPUTERNAME"
          Write-Host "store=$store"
          Write-Host "sentinel=$sentinel"
          Write-Host "meeting_id=$env:ROOMHOP_TEST_MEETING_ID"
          Write-Host "identity_id=$env:ROOMHOP_TEST_IDENTITY_ID"
          Write-Host "service_pid=$($proc.ProcessId)"
          Write-Host "service_owner=$actualOwner"
          Write-Host "service_executable=$($proc.ExecutablePath)"
          Write-Host "service_command_line=$($proc.CommandLine)"
          Write-Host "service_parent_pid=$($proc.ParentProcessId)"
          Write-Host "service_parent_name=$($parent.Name)"
          Write-Host "service_source_sha=$env:GITHUB_SHA"

      - name: Run Browser Adapter live E2E
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m pip install pytest requests
          python -m pytest -v tests/test_browser_agent_adapter_e2e.py --junitxml=test-results/junit-browser-adapter-windows.xml

      - name: Verify disposable-store sentinel after run
        if: always()
        shell: pwsh
        run: |
          $store = $env:ROOMHOP_TEST_MEETINGS_DIR
          $sentinel = if ($store) { Join-Path $store ".roomhop-disposable-test-store" } else { "" }
          if (-not $sentinel -or -not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw "BLOCKED: disposable-store sentinel disappeared after test"
          }

      - name: Upload Windows Browser Adapter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-ci-evidence-windows-browser-adapter
          path: test-results/junit-browser-adapter-windows.xml
          if-no-files-found: warn
          retention-days: 14

  release_gate:
    name: Work 32 release acceptance gate
    if: always()
    needs: [unit, tooling, e2e, windows_browser_adapter, product_artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory lanes
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          WINDOWS_RESULT: ${{ needs.windows_browser_adapter.result }}
          ARTIFACT_RESULT: ${{ needs.product_artifact.result }}
        run: |
          printf 'unit=%s\ntooling=%s\ne2e=%s\nwindows_browser_adapter=%s\nproduct_artifact=%s\n' "$UNIT_RESULT" "$TOOLING_RESULT" "$E2E_RESULT" "$WINDOWS_RESULT" "$ARTIFACT_RESULT"
          test "$UNIT_RESULT" = success
          test "$TOOLING_RESULT" = success
          test "$E2E_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$ARTIFACT_RESULT" = success

  product_artifact:
    name: Build and verify immutable ROOM HOP product artifact
    needs: [unit, e2e, tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPOSITORY: ${{ github.repository }}
      REVISION: ${{ github.sha }}
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build immutable source artifact and checksum
        run: |
          mkdir -p dist product
          BUNDLE="room-hop-${REVISION}.tar.gz"
          git archive --format=tar.gz --prefix="room-hop-${REVISION}/" "${REVISION}" > "dist/${BUNDLE}"
          cd dist
          sha256sum "${BUNDLE}" | tee "${BUNDLE}.sha256"
          sha256sum --check "${BUNDLE}.sha256"
          cd ..

      - name: Install dependencies and verify extracted product artifact
        run: |
          BUNDLE="room-hop-${REVISION}.tar.gz"
          tar -xzf "dist/${BUNDLE}" -C product
          cd "product/room-hop-${REVISION}"
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check
          python -m compileall -q core agents execution_host room_hop_mcp
          mkdir -p test-results
          python -m pytest -q tests/test_ci_product_e2e.py --junitxml=test-results/junit-product-artifact.xml

      - name: Retain immutable product artifact, checksum and artifact-level E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-hop-product-release-candidate
          path: |
            dist/room-hop-${{ github.sha }}.tar.gz
            dist/room-hop-${{ github.sha }}.tar.gz.sha256
            product/room-hop-${{ github.sha }}/test-results/junit-product-artifact.xml
          if-no-files-found: warn
          retention-days: 14
