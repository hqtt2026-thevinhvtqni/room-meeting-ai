name: ROOM HOP CI Pilot

on:
  push:
    branches:
      - work/32-ci-cd-python-ci-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: room-hop-ci-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci-pilot:
    name: Python 3.12 compile and bounded unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile application packages
        run: python -m compileall -q core agents

      - name: Run bounded deterministic pilot tests
        run: |
          mkdir -p test-results
          python -m pytest -q tests/test_agent_registry.py tests/test_connectors.py tests/test_context_loader.py tests/test_discussion.py tests/test_e2e.py tests/test_meeting.py tests/test_execution_host.py tests/test_file_ops_agent.py tests/test_governance.py tests/test_identity.py tests/test_importer.py tests/test_intent_router.py tests/test_llama_intent_router.py tests/test_meeting_lifecycle_v021.py tests/test_meeting_manager_allocator.py tests/test_meeting_service.py tests/test_message_v1.py tests/test_secretary.py tests/test_secretary_acceptance_abc.py tests/test_secretary_meeting_acceptance.py tests/test_wee_8031_bridge.py --junitxml=test-results/junit.xml

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-hop-ci-evidence
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
