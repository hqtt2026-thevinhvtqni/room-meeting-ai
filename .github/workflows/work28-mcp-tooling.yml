name: Work 28 MCP Tooling Tests

on:
  push:
    branches:
      - work/28-mcp-tooling-platform
    paths:
      - "work/28/**"
      - ".github/workflows/work28-mcp-tooling.yml"
  pull_request:
    paths:
      - "work/28/**"
      - ".github/workflows/work28-mcp-tooling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-regression-tests:
    # REL-01: pinned to ubuntu-24.04 so the ubuntu-latest label migration
    # (announced for October 2026) cannot change the runner underneath us.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        # REL-01: v5 runs on the supported Node runtime (v4 targeted Node 20, deprecated).
        uses: actions/checkout@v5
      - name: Set up Python
        # REL-01: v6 runs on the supported Node runtime (v5 targeted Node 20, deprecated).
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install MCP SDK for unified-server factory tests
        run: python -m pip install "mcp>=1.0.0,<2.0.0"
      - name: Run Work 28 unit and regression tests
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        env:
          PYTHONPATH: 04_CODE
        run: |
          set -o pipefail
          python -m unittest discover -s 05_TEST -v 2>&1 | tee unittest-output.txt
      - name: Surface failure details as public annotations and summary
        if: failure()
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        run: |
          ls -la unittest-output.txt || true
          {
            echo "## Unittest failure details"
            echo ""
            echo '~~~'
            tail -n 150 unittest-output.txt || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY" || true
          grep -A10 "ImportError: Failed to import" unittest-output.txt | head -40 | while IFS= read -r line; do
            printf '::error::%s\n' "$line" || true
          done || true
          exit 0
