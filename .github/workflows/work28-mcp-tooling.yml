name: Work 28 Automatic E2E Gate

on:
  push:
    branches:
      - work/28-mcp-tooling-platform
    paths:
      - "work/28/**"
      - "execution_host/**"
      - "core/execution_authority/**"
      - "room_hop_mcp/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/work28-mcp-tooling.yml"
  pull_request:
    paths:
      - "work/28/**"
      - "execution_host/**"
      - "core/execution_authority/**"
      - "room_hop_mcp/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/work28-mcp-tooling.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work28-auto-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
        shell: bash
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install declared project dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip check
      - name: Compile Work 28 and execution packages
        run: |
          python -m compileall -q core execution_host room_hop_mcp work/28/MCP-8020-TOOLING-PLATFORM/04_CODE
      - name: Run Work 28 unit and regression tests
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        env:
          PYTHONPATH: 04_CODE
        run: |
          set -o pipefail
          python -m unittest discover -s 05_TEST -v 2>&1 | tee unittest-output.txt
      - name: Run full Work 28 pytest suite on exact triggering SHA
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        env:
          PYTHONPATH: 04_CODE
        run: |
          set -o pipefail
          python -m pytest 05_TEST -q 2>&1 | tee pytest-output.txt
      - name: Surface failure details as public annotations and summary
        if: failure()
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        run: |
          ls -la unittest-output.txt || true
          {
            echo "## Unittest failure details"
            echo ""
            echo '~~~'
            tail -n 150 unittest-output.txt || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

  execution-host-lifecycle-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
        shell: bash
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest for suspended-spawn lifecycle tests (Linux)
        run: python -m pip install pytest
      - name: Run execution_host lifecycle + WP14–WP23 tests (Linux)
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_process_job.py' -v 2>&1 | tee lifecycle-output.txt
          python -m pytest tests/test_process_job_suspended_spawn.py -q 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_contract.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_execution_host_auth.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_grant.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_dispatch.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_evidence.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_readback.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_bounds.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_audit_readiness.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_http_limits.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_http_schema.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_process_job_gate.py' -v 2>&1 | tee -a lifecycle-output.txt
      - name: Surface lifecycle failure details
        if: failure()
        run: |
          {
            echo "## Lifecycle failure (Linux)"
            echo '~~~'
            tail -n 100 lifecycle-output.txt || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

  execution-host-lifecycle-windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
        shell: bash
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest for suspended-spawn lifecycle tests (Windows)
        run: python -m pip install pytest
      - name: Run execution_host lifecycle + WP14–WP23 tests (Windows)
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_process_job.py' -v 2>&1 | Tee-Object -FilePath lifecycle-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_process_job_suspended_spawn.py -q 2>&1 | Tee-Object -FilePath lifecycle-wp2-suspended-spawn.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_work28_contract.py' -v 2>&1 | Tee-Object -FilePath lifecycle-output-wp14.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_execution_host_auth.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp15-auth.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_work28_grant.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp15-grant.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_work28_dispatch.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp16-dispatch.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_work28_evidence.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp18-evidence.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_work28_readback.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp19-readback.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_work28_bounds.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp20-bounds.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_work28_audit_readiness.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp21-audit.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_work28_http_limits.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp22-limits.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_work28_http_schema.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp23-schema.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_process_job_gate.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp2-gate.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: Surface lifecycle failure details (Windows)
        if: failure()
        run: |
          Get-Content lifecycle-output.txt -Tail 80 -ErrorAction SilentlyContinue | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content lifecycle-wp23-schema.txt -Tail 80 -ErrorAction SilentlyContinue | Out-File -Append $env:GITHUB_STEP_SUMMARY
        shell: pwsh

  immutable-source-artifact:
    name: Build and retest exact-SHA Work 28 source artifact
    needs:
      - unit-regression-tests
      - execution-host-lifecycle-linux
      - execution-host-lifecycle-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact triggering revision without submodule recursion
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
        shell: bash
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and verify immutable exact-SHA archive
        run: |
          mkdir -p dist extracted
          ARCHIVE="work28-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --prefix="work28-${GITHUB_SHA}/" "${GITHUB_SHA}" > "dist/${ARCHIVE}"
          cd dist
          sha256sum "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
          sha256sum --check "${ARCHIVE}.sha256"
          cd ..
          tar -xzf "dist/${ARCHIVE}" -C extracted
      - name: Install and verify extracted artifact
        working-directory: extracted/work28-${{ github.sha }}
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m compileall -q core execution_host room_hop_mcp work/28/MCP-8020-TOOLING-PLATFORM/04_CODE
          mkdir -p test-results
          python -m unittest discover -s work/28/MCP-8020-TOOLING-PLATFORM/05_TEST -v 2>&1 | tee test-results/artifact-unittest.log
      - name: Retain immutable source archive, checksum and artifact test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work28-source-artifact-${{ github.sha }}
          path: |
            dist/work28-${{ github.sha }}.tar.gz
            dist/work28-${{ github.sha }}.tar.gz.sha256
            extracted/work28-${{ github.sha }}/test-results/artifact-unittest.log
          if-no-files-found: warn
          retention-days: 14

  automatic-e2e-gate-report:
    if: always()
    needs:
      - unit-regression-tests
      - execution-host-lifecycle-linux
      - execution-host-lifecycle-windows
      - immutable-source-artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Calculate evidence-backed Auto E2E gate state
        env:
          UNIT_RESULT: ${{ needs.unit-regression-tests.result }}
          LINUX_RESULT: ${{ needs.execution-host-lifecycle-linux.result }}
          WINDOWS_RESULT: ${{ needs.execution-host-lifecycle-windows.result }}
          ARTIFACT_RESULT: ${{ needs.immutable-source-artifact.result }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          jobs = {
              "unit_regression": os.environ["UNIT_RESULT"],
              "execution_host_linux": os.environ["LINUX_RESULT"],
              "execution_host_windows": os.environ["WINDOWS_RESULT"],
              "immutable_source_artifact": os.environ["ARTIFACT_RESULT"],
          }
          ci_ok = all(value == "success" for value in jobs.values())
          report = {
              "schema_version": 1,
              "workflow": "work28-auto-e2e",
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "ci_preconditions": "PASS" if ci_ok else "FAIL",
              "jobs": jobs,
              "deployed_mcp_core_runtime_e2e": "BLOCKED",
              "blockers": [
                  "No verified live MCP 8030 build/process identity and tools/list parity artifact is wired to this workflow.",
                  "No trusted deployed Core principal/WorkContext authorization evidence is available to this runner.",
                  "No approved canonical Runtime MCP and Execution Host deployment/isolation attestation is wired to this workflow.",
                  "No complete deployed request-to-protected-evidence readback chain is available; local CI and mocks cannot substitute."
              ],
              "overall_status": "BLOCKED" if ci_ok else "FAIL",
              "execution_gate": "CLOSED",
              "release_status": "NOT_RELEASED",
              "note": "A green CI result is not live deployed MCP-to-Core-to-Runtime E2E acceptance."
          }
          with open("work28-auto-e2e-report.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(report, f, indent=2, sort_keys=True)
              f.write("\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# Work 28 Automatic E2E Gate\n\n")
              f.write(f"- Source commit: `{report['source_commit']}`\n")
              f.write(f"- CI preconditions: **{report['ci_preconditions']}**\n")
              for name, result in jobs.items():
                  f.write(f"- {name}: **{result}**\n")
              f.write("- Deployed MCP → Core → Runtime E2E: **BLOCKED**\n")
              f.write("- Execution Gate: **CLOSED**\n")
              f.write("- Release: **NOT RELEASED**\n\n")
              f.write("## Blockers\n")
              for item in report["blockers"]:
                  f.write(f"- {item}\n")
          PY
      - name: Upload machine-readable Auto E2E report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work28-auto-e2e-report-${{ github.run_id }}
          path: work28-auto-e2e-report.json
          if-no-files-found: error
          retention-days: 30
