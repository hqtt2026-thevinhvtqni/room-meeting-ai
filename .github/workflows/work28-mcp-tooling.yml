name: Work 28 MCP Tooling Tests

on:
  push:
    branches:
      - work/28-mcp-tooling-platform
    paths:
      - "work/28/**"
      - "execution_host/**"
      - "tests/**"
      - ".github/workflows/work28-mcp-tooling.yml"
  pull_request:
    paths:
      - "work/28/**"
      - "execution_host/**"
      - "tests/**"
      - ".github/workflows/work28-mcp-tooling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-regression-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install MCP SDK for unified-server factory tests
        run: python -m pip install "mcp>=1.0.0,<2.0.0"
      - name: Run Work 28 unit and regression tests
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        env:
          PYTHONPATH: 04_CODE
        run: |
          set -o pipefail
          python -m unittest discover -s 05_TEST -v 2>&1 | tee unittest-output.txt
      - name: Surface failure details as public annotations and summary
        if: failure()
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        run: |
          ls -la unittest-output.txt || true
          {
            echo "## Unittest failure details"
            echo ""
            echo '~~~'
            tail -n 150 unittest-output.txt || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

  execution-host-lifecycle-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run execution_host lifecycle + WP14–WP22 tests (Linux)
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_process_job.py' -v 2>&1 | tee lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_contract.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_execution_host_auth.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_grant.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_dispatch.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_evidence.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_readback.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_bounds.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_audit_readiness.py' -v 2>&1 | tee -a lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_http_limits.py' -v 2>&1 | tee -a lifecycle-output.txt
      - name: Surface lifecycle failure details
        if: failure()
        run: |
          {
            echo "## Lifecycle failure (Linux)"
            echo '~~~'
            tail -n 100 lifecycle-output.txt || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

  execution-host-lifecycle-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run execution_host lifecycle + WP14–WP22 tests (Windows)
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_process_job.py' -v 2>&1 | Tee-Object -FilePath lifecycle-output.txt
          python -m unittest discover -s tests -p 'test_work28_contract.py' -v 2>&1 | Tee-Object -FilePath lifecycle-output-wp14.txt
          python -m unittest discover -s tests -p 'test_execution_host_auth.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp15-auth.txt
          python -m unittest discover -s tests -p 'test_work28_grant.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp15-grant.txt
          python -m unittest discover -s tests -p 'test_work28_dispatch.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp16-dispatch.txt
          python -m unittest discover -s tests -p 'test_work28_evidence.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp18-evidence.txt
          python -m unittest discover -s tests -p 'test_work28_readback.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp19-readback.txt
          python -m unittest discover -s tests -p 'test_work28_bounds.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp20-bounds.txt
          python -m unittest discover -s tests -p 'test_work28_audit_readiness.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp21-audit.txt
          python -m unittest discover -s tests -p 'test_work28_http_limits.py' -v 2>&1 | Tee-Object -FilePath lifecycle-wp22-limits.txt
        shell: pwsh
      - name: Surface lifecycle failure details (Windows)
        if: failure()
        run: |
          Get-Content lifecycle-output.txt -Tail 80 -ErrorAction SilentlyContinue | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content lifecycle-wp22-limits.txt -Tail 80 -ErrorAction SilentlyContinue | Out-File -Append $env:GITHUB_STEP_SUMMARY
        shell: pwsh
