name: Work 28 MCP Tooling Tests

on:
  push:
    branches:
      - work/28-mcp-tooling-platform
    paths:
      - "work/28/**"
      - ".github/workflows/work28-mcp-tooling.yml"
  pull_request:
    paths:
      - "work/28/**"
      - ".github/workflows/work28-mcp-tooling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Work 28 unit and regression tests
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        env:
          PYTHONPATH: 04_CODE
        run: |
          set -o pipefail
          python -m unittest discover -s 05_TEST -v 2>&1 | tee unittest-output.txt
      - name: Surface failure details as public annotations
        if: failure()
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        run: |
          grep -E "(FAIL:|ERROR:|Traceback|AssertionError|ImportError|SyntaxError|FAILED|exit code)" unittest-output.txt | tail -n 10 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
