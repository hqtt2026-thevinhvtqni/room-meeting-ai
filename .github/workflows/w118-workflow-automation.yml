# W118 HQTT GitHub Workflow Automation — PILOT v1
# Work 118: event orchestration GitHub-native (docs TD-118-005/006), least-privilege.
# Safety: GITHUB_TOKEN events do not re-trigger workflows (no loop by design).
# Pilot scope only: comments + labels + diagnostics issues. No merge, no push, no branch protection.

name: W118 Workflow Automation Pilot

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["W300 Dashboard CI", "Work 70 Preview Host Tests"]
    types: [completed]

permissions:
  issues: write
  contents: read

concurrency:
  group: w118-automation-${{ github.event_name }}-${{ github.event.issue.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  handoff-brief:
    if: >
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'w118-handoff')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post handoff brief
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "W118 pilot: handoff registered. Assignment is a nomination only. The worker must comment ACKED-<role> to confirm receipt. Evidence will be recorded in the Work evidence register."

  ack-verification:
    if: >
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'ACKED-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record ACK evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          printf '%s' \
            'W118 pilot: ACK recorded.' \
            "- Actor: $AUTHOR" \
            '- Token acked: yes (body starts with ACKED-)' \
            '- Limitation: role mapping check is MANUAL in pilot v1; coordinator (Xu) must verify the actor login against the Work role file during acceptance.' \
            > /tmp/ack.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/ack.md

  ci-failure-diagnostics:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update failure diagnostics issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TITLE="[w118] CI FAIL: $WF_NAME run $RUN_ID"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label w118-blocked --search "$TITLE" --json number -q '.[].number' | head -n 1)
          cat > /tmp/body.md <<EOF
          W118 pilot failure diagnostics.
          - Workflow: $WF_NAME
          - Run: $RUN_URL
          - Commit: $SHA
          - Owner of fix: pending assignment. Do not retry before an actor comments RETRY-1 or RETRY-2 with a reason (retry cap 2).
          EOF
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label w118-blocked --body-file /tmp/body.md
          fi
