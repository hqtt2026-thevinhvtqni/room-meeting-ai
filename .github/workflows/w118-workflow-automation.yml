name: W118 Auto E2E Validation
run-name: W118 Auto E2E — ${{ github.event_name }} — ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - work/118-auto-e2e-v2
    paths:
      - ".github/workflows/w118-workflow-automation.yml"
      - ".github/workflows/w118-failure-diagnostics.yml"
      - ".github/workflows/w118-pr-review-checklist.yml"
      - ".github/w118/**"
      - "scripts/w118/**"
      - "tests/w118/**"
      - "work/118/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/w118-workflow-automation.yml"
      - ".github/workflows/w118-failure-diagnostics.yml"
      - ".github/workflows/w118-pr-review-checklist.yml"
      - ".github/w118/**"
      - "scripts/w118/**"
      - "tests/w118/**"
      - "work/118/**"
  workflow_dispatch:
    inputs:
      failure_injection:
        description: "Controlled failure-path test; only permitted on the W118 feature branch"
        required: false
        default: "none"
        type: choice
        options: [none, controlled]
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: w118-${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Run W118 contract tests
        id: tests
        run: python -m unittest discover -s tests/w118 -v
      - name: Write run evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p .w118-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          run_id = int(os.environ["GITHUB_RUN_ID"])
          pr_head_sha = os.environ.get("PR_HEAD_SHA", "")
          source_commit = pr_head_sha or os.environ["GITHUB_SHA"]
          source_ref = os.environ.get("PR_HEAD_REF") or os.environ["GITHUB_REF_NAME"]
          record = {
              "schema_version": "1.0",
              "work_id": "118",
              "evidence_type": "CI_CONTRACT",
              "workflow": "W118 Auto E2E Validation",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": run_id,
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              "actor": os.environ["GITHUB_ACTOR"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF", ""),
              "source_ref": source_ref,
              "source_commit": source_commit,
              "tested_ref": os.environ["GITHUB_REF"],
              "tested_commit": os.environ["GITHUB_SHA"],
              "pull_request_number": int(os.environ["PR_NUMBER"]) if os.environ.get("PR_NUMBER") else None,
              "pull_request_base_sha": os.environ.get("PR_BASE_SHA") or None,
              "test_outcome": os.environ.get("TEST_OUTCOME", "unknown"),
              "state": "RECORDED",
              "limitations": ["CI evidence does not constitute independent review or Work acceptance."]
          }
          Path(".w118-evidence/run-evidence.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          cat .w118-evidence/run-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w118-run-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .w118-evidence/run-evidence.json
          if-no-files-found: error
          retention-days: 30

  controlled-failure-dispatch:
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.comment.body == 'W118-TEST-DIAGNOSTICS' && startsWith(github.event.issue.title, '[W118 E2E TEST]') && contains(github.event.issue.labels.*.name, 'w118-handoff') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted authorization policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Authorize controlled failure test
        id: authorize_controlled_failure
        env:
          AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          python scripts/w118/controlled_test_authorization.py --login "$AUTHOR" > /tmp/test-auth.json
          cat /tmp/test-auth.json >> "$GITHUB_STEP_SUMMARY"
          ALLOWED=$(python -c 'import json; print("true" if json.load(open("/tmp/test-auth.json"))["authorized"] else "false")')
          echo "authorized=$ALLOWED" >> "$GITHUB_OUTPUT"
          if [ "$ALLOWED" != "true" ]; then
            echo "Controlled diagnostics test denied; no workflow dispatched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
      - name: Dispatch controlled failure on isolated W118 branch
        if: steps.authorize_controlled_failure.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run w118-workflow-automation.yml --repo "$GITHUB_REPOSITORY" --ref work/118-auto-e2e-v2 --field failure_injection=controlled

  controlled-failure:
    if: github.event_name == 'workflow_dispatch' && inputs.failure_injection == 'controlled' && github.ref == 'refs/heads/work/118-auto-e2e-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout trusted controlled-test policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Authorize direct controlled-failure dispatch actor
        id: authorize_direct_dispatch
        env:
          AUTHOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          python scripts/w118/controlled_test_authorization.py --login "$AUTHOR" > /tmp/direct-test-auth.json
          cat /tmp/direct-test-auth.json >> "$GITHUB_STEP_SUMMARY"
          ALLOWED=$(python -c 'import json; print("true" if json.load(open("/tmp/direct-test-auth.json"))["authorized"] else "false")')
          echo "authorized=$ALLOWED" >> "$GITHUB_OUTPUT"
          if [ "$ALLOWED" != "true" ]; then
            echo "Direct workflow_dispatch denied; no fault injection executed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Emit controlled failure for diagnostics E2E
        if: steps.authorize_direct_dispatch.outputs.authorized == 'true'
        run: |
          echo "W118 controlled failure-path test; no production workflow is modified."
          exit 17

  handoff:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'w118-handoff' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: w118-handoff-${{ github.event.issue.number }}-${{ github.event.label.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout role policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record handoff exactly once per issue-label event
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL_ID: ${{ github.event.label.id }}
          ISSUE_UPDATED_AT: ${{ github.event.issue.updated_at }}
          LABELER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          echo "decision=HANDOFF_FAILED" >> "$GITHUB_OUTPUT"
          MARKER="<!-- w118-handoff:${ISSUE}:${LABEL_ID}:${ISSUE_UPDATED_AT} -->"
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments?per_page=100" --jq '.[].body' | grep -Fq "$MARKER"; then
            echo "Handoff already recorded: $MARKER" >> "$GITHUB_STEP_SUMMARY"
            echo "decision=HANDOFF_DUPLICATE_SKIPPED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat > /tmp/handoff.md <<EOF
          W118 handoff event recorded.

          - Issue: #${ISSUE}
          - Label event: ${LABEL_ID}
          - Label applied by: @${LABELER}
          - ACK format: `ACKED-<role> ${ISSUE}`
          - Authorization: only active principals and explicitly mapped ACK roles in `.github/w118/role-map.json` are accepted.
          - Unmapped actor/role: denied; no assignment or state transition is inferred.

          ${MARKER}
          EOF
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/handoff.md
          echo "decision=HANDOFF_RECORDED" >> "$GITHUB_OUTPUT"
      - name: Write handoff event evidence
        if: always()
        env:
          DECISION: ${{ steps.handoff.outputs.decision || 'HANDOFF_FAILED' }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL_ID: ${{ github.event.label.id }}
          ISSUE_UPDATED_AT: ${{ github.event.issue.updated_at }}
          LABELER: ${{ github.event.sender.login }}
        run: |
          mkdir -p .w118-event-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.w118.event_evidence import build_event_evidence
          record = build_event_evidence(
              event_type="issues.labeled",
              event_id=f"issue-{os.environ['ISSUE']}-label-{os.environ['LABEL_ID']}-{os.environ['ISSUE_UPDATED_AT']}",
              source_commit=os.environ["GITHUB_SHA"],
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              actor=os.environ["LABELER"],
              decision=os.environ["DECISION"],
              details={"issue": int(os.environ["ISSUE"]), "label_id": os.environ["LABEL_ID"]},
          )
          Path(".w118-event-evidence/handoff.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload handoff event evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w118-handoff-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .w118-event-evidence/handoff.json
          if-no-files-found: error
          retention-days: 30

  ack-verification:
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && startsWith(github.event.comment.body, 'ACKED-') && contains(github.event.issue.labels.*.name, 'w118-handoff') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout role policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify actor, requested role, and issue binding
        id: ack
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          echo "decision=ACK_FAILED" >> "$GITHUB_OUTPUT"
          echo "label_applied=false" >> "$GITHUB_OUTPUT"
          python scripts/w118/authorization.py --login "$AUTHOR" --body "$BODY" --issue "$ISSUE" > /tmp/ack-result.json
          cat /tmp/ack-result.json >> "$GITHUB_STEP_SUMMARY"
          AUTHORIZED=$(python -c 'import json; print("true" if json.load(open("/tmp/ack-result.json"))["authorized"] else "false")')
          ROLE=$(python -c 'import json; print(json.load(open("/tmp/ack-result.json")).get("role", "unknown"))')
          REASON=$(python -c 'import json; print(json.load(open("/tmp/ack-result.json"))["reason"])')
          MARKER="<!-- w118-ack-result:${COMMENT_ID} -->"
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments?per_page=100" --jq '.[].body' | grep -Fq "$MARKER"; then
            echo "ACK result already recorded for comment ${COMMENT_ID}." >> "$GITHUB_STEP_SUMMARY"
            echo "decision=ACK_DUPLICATE_SKIPPED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$AUTHORIZED" = "true" ]; then
            gh label create w118-acked --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Work 118 ACK verified by mapped actor" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label w118-acked
            echo "decision=ACK_AUTHORIZED" >> "$GITHUB_OUTPUT"
            echo "label_applied=true" >> "$GITHUB_OUTPUT"
            printf 'W118 ACK VERIFIED\n\n- Actor: @%s\n- Role: %s\n- Issue: #%s\n- Result: authorized by role map; label `w118-acked` applied.\n\n%s\n' "$AUTHOR" "$ROLE" "$ISSUE" "$MARKER" > /tmp/ack-response.md
          else
            echo "decision=ACK_DENIED" >> "$GITHUB_OUTPUT"
            printf 'W118 ACK UNVERIFIED — no assignment or state transition was made.\n\n- Actor: @%s\n- Requested role: %s\n- Issue: #%s\n- Reason: %s\n\n%s\n' "$AUTHOR" "$ROLE" "$ISSUE" "$REASON" "$MARKER" > /tmp/ack-response.md
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/ack-response.md
      - name: Write ACK event evidence
        if: always()
        env:
          DECISION: ${{ steps.ack.outputs.decision || 'ACK_FAILED' }}
          AUTHOR: ${{ github.event.comment.user.login }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BODY: ${{ github.event.comment.body }}
          LABEL_APPLIED: ${{ steps.ack.outputs.label_applied || 'false' }}
        run: |
          mkdir -p .w118-event-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.w118.event_evidence import build_event_evidence
          record = build_event_evidence(
              event_type="issue_comment",
              event_id=f"comment-{os.environ['COMMENT_ID']}",
              source_commit=os.environ["GITHUB_SHA"],
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              actor=os.environ["AUTHOR"],
              decision=os.environ["DECISION"],
              details={"issue": int(os.environ["ISSUE"]), "comment_id": os.environ["COMMENT_ID"], "label_applied": os.environ["LABEL_APPLIED"] == "true"},
          )
          Path(".w118-event-evidence/ack.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload ACK event evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w118-ack-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .w118-event-evidence/ack.json
          if-no-files-found: error
          retention-days: 30

  acceptance-review:
    if: github.event_name == 'pull_request_review' && github.event.action == 'submitted' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted default-branch acceptance policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve trusted policy commit
        id: policy
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify independent acceptance authority
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          set -euo pipefail
          echo "decision=REVIEW_FAILED" >> "$GITHUB_OUTPUT"
          python scripts/w118/review_authorization.py --reviewer "$REVIEWER" --pr-author "$PR_AUTHOR" > /tmp/review-result.json
          cat /tmp/review-result.json >> "$GITHUB_STEP_SUMMARY"
          ALLOWED=$(python -c 'import json; print("true" if json.load(open("/tmp/review-result.json"))["authorized"] else "false")')
          if [ "$ALLOWED" != "true" ]; then
            echo "Review is visible in GitHub but is not an authorized W118 acceptance decision." >> "$GITHUB_STEP_SUMMARY"
            echo "decision=REVIEW_UNVERIFIED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MARKER="<!-- w118-review-result:${REVIEW_ID} -->"
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[].body' | grep -Fq "$MARKER"; then
            echo "Review result already recorded." >> "$GITHUB_STEP_SUMMARY"
            echo "decision=REVIEW_DUPLICATE_SKIPPED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'W118 independent acceptance reviewer verified: @%s. This records reviewer authority only; it does not merge or release.\n\n%s\n' "$REVIEWER" "$MARKER" > /tmp/review-response.md
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/review-response.md
          echo "decision=REVIEW_AUTHORIZED" >> "$GITHUB_OUTPUT"
      - name: Write review event evidence
        if: always()
        env:
          DECISION: ${{ steps.review.outputs.decision || 'REVIEW_FAILED' }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          POLICY_SHA: ${{ steps.policy.outputs.sha }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .w118-event-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.w118.event_evidence import build_event_evidence
          record = build_event_evidence(
              event_type="pull_request_review",
              event_id=f"review-{os.environ['REVIEW_ID']}",
              source_commit=os.environ["POLICY_SHA"],
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              actor=os.environ["REVIEWER"],
              decision=os.environ["DECISION"],
              details={
                  "pr_number": int(os.environ["PR_NUMBER"]),
                  "pr_author": os.environ["PR_AUTHOR"],
                  "policy_commit": os.environ["POLICY_SHA"],
                  "event_commit": os.environ["EVENT_SHA"],
                  "pr_head_sha": os.environ["PR_HEAD_SHA"],
                  "pr_base_sha": os.environ["PR_BASE_SHA"],
              },
          )
          Path(".w118-event-evidence/review.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload review event evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w118-review-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .w118-event-evidence/review.json
          if-no-files-found: error
          retention-days: 30
