name: W300 Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - "work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard/**"
      - ".github/workflows/w300-dashboard-ci.yml"
  pull_request:
    paths:
      - "work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard/**"
      - ".github/workflows/w300-dashboard-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w300-dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-quality:
    name: Dashboard / Typecheck / Lint / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
