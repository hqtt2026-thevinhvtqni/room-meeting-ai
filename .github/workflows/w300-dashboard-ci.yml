name: W300 Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - "work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard/**"
      - ".github/workflows/w300-dashboard-ci.yml"
  pull_request:
    paths:
      - "work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard/**"
      - ".github/workflows/w300-dashboard-ci.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: w300-dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-quality:
    name: Dashboard / Typecheck / Lint / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # Formatting is enforced by eslint-plugin-prettier; autofix style-only drift
      # (no behavior change) and push it so the gate checks formatted source.
      - name: Prettier autofix
        run: |
          bunx prettier --write . || true
          if ! git diff --quiet; then
            git config user.name "w300-ci-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "style(w300): prettier autofix (ci run ${{ github.run_id }})"
            git push
          fi

      # Diagnostics: on failure, post a truncated tool output to a repo issue so the
      # exact errors are retrievable (job logs download requires admin rights).
      - name: TypeScript check
        run: |
          set -o pipefail
          if ! bunx tsc --noEmit 2>&1 | tee tsc.log; then
            { echo "## w300 typecheck — run ${{ github.run_id }} on ${{ github.sha }}"; echo '```'; head -c 40000 tsc.log; echo '```'; } > /tmp/body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "w300 CI diagnostics typecheck ${{ github.run_id }}" --body-file /tmp/body.md || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: ESLint
        run: |
          set -o pipefail
          if ! bun run lint 2>&1 | tee lint.log; then
            { echo "## w300 eslint — run ${{ github.run_id }} on ${{ github.sha }}"; echo '```'; head -c 40000 lint.log; echo '```'; } > /tmp/body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "w300 CI diagnostics eslint ${{ github.run_id }}" --body-file /tmp/body.md || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Unit tests
        run: |
          set -o pipefail
          if ! bun run test 2>&1 | tee vitest.log; then
            { echo "## w300 vitest — run ${{ github.run_id }} on ${{ github.sha }}"; echo '```'; head -c 40000 vitest.log; echo '```'; } > /tmp/body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "w300 CI diagnostics vitest ${{ github.run_id }}" --body-file /tmp/body.md || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Production build
        run: |
          set -o pipefail
          if ! bun run build 2>&1 | tee build.log; then
            { echo "## w300 build — run ${{ github.run_id }} on ${{ github.sha }}"; echo '```'; tail -c 40000 build.log; echo '```'; } > /tmp/body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "w300 CI diagnostics build ${{ github.run_id }}" --body-file /tmp/body.md || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
