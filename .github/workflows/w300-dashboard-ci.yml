name: W300 Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - "work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard/**"
      - ".github/workflows/w300-dashboard-ci.yml"
  pull_request:
    paths:
      - "work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard/**"
      - ".github/workflows/w300-dashboard-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w300-dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-quality:
    name: Dashboard / Typecheck / Lint / Tests / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # Diagnostics: on failure, mirror the tool output into the job summary so the
      # exact errors are publicly viewable (job logs download requires admin rights).
      - name: TypeScript check
        run: |
          set -o pipefail
          if ! bunx tsc --noEmit 2>&1 | tee tsc.log; then
            { echo "## w300 typecheck (tsc --noEmit)"; echo '```'; cat tsc.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: ESLint
        run: |
          set -o pipefail
          if ! bun run lint 2>&1 | tee lint.log; then
            { echo "## w300 eslint output"; echo '```'; cat lint.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          if ! bun run test 2>&1 | tee vitest.log; then
            { echo "## w300 vitest output"; echo '```'; cat vitest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Production build
        run: |
          set -o pipefail
          if ! bun run build 2>&1 | tee build.log; then
            { echo "## w300 build output"; echo '```'; tail -c 4000 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
