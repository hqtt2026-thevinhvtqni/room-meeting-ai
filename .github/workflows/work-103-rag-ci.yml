name: Work 103 RAG Retrieval CI

on:
  push:
    branches: ["work/103-rag-retrieval-capability"]
    paths: ["work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/**", ".github/workflows/work-103-rag-ci.yml"]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax compile (py_compile)
        run: |
          python -m py_compile work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE/rag_retrieval.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE/rag_eval.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/05_TEST/test_rag_retrieval.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/05_TEST/test_rag_eval.py
          echo "py_compile exit code: 0"

      - name: Unit tests (verbose)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: |
          python -m unittest discover -s ../05_TEST -p "test_rag_retrieval.py" -v
          python -m unittest discover -s ../05_TEST -p "test_rag_eval.py" -v

      - name: Labeled retrieval evaluation (baseline gate, fails CI if below baseline)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: python rag_eval.py

      - name: Grounded-abstention diagnostic (report-only; strict gate unchanged)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: python ../05_TEST/grounded_abstention_eval.py > ../06_EVIDENCE/grounded_abstention_diagnostic.json

      - name: Manifest V4 + Ka V3 corpus-aligned evaluation (independent gate)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: python rag_eval.py --eval-set ../05_TEST/EVAL_SET_CORPUS_V4_V3.json --diagnostics

      - name: Controlled retrieval experiment sweep
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: python rag_experiment.py > rag_experiment_results.json

      - name: Upload controlled experiment results
        uses: actions/upload-artifact@v4
        with:
          name: work-103-retrieval-experiment-py${{ matrix.python-version }}
          path: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE/rag_experiment_results.json
          if-no-files-found: error
          retention-days: 30
