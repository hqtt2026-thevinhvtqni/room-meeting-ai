name: Work 103 RAG Retrieval CI

on:
  push:
    branches: ["work/103-rag-retrieval-capability"]
    paths: ["work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/**", ".github/workflows/work-103-rag-ci.yml"]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax compile (py_compile)
        run: |
          python -m py_compile work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE/rag_retrieval.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE/rag_eval.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE/rag_evidence_support.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE/rag_evidence_support_corpus_eval.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/05_TEST/test_rag_retrieval.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/05_TEST/test_rag_eval.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/05_TEST/test_rag_evidence_support.py \
            work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/05_TEST/test_rag_evidence_support_corpus_eval.py
          echo "py_compile exit code: 0"

      - name: Unit tests (verbose; failures surfaced as annotations)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: |
          set +e
          overall=0
          for p in test_rag_retrieval.py test_rag_eval.py test_rag_evidence_support.py test_rag_evidence_support_corpus_eval.py; do
            log="/tmp/unittest-${p}.log"
            python -m unittest discover -s ../05_TEST -p "$p" -v > "$log" 2>&1
            code=$?
            if [ $code -ne 0 ]; then
              overall=1
              echo "===== $p FAILED (full log) ====="
              cat "$log"
              grep -E "^(FAIL|ERROR):|^AssertionError|AssertionError:|^[A-Za-z_.]*Error" "$log" | head -10 | while IFS= read -r line; do
                echo "::error::[${p}] ${line}"
              done
              echo "::error::[${p}] unittest discover exited non-zero; see step log for full tracebacks"
            fi
          done
          exit $overall

      - name: Evidence-support decision-set gate (Gate B; fails CI on any per-case mismatch)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: python rag_evidence_support.py

      - name: Evidence-support corpus diagnostic (Gate C preparatory; report-only, authored specs pending independent adjudication)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: |
          python rag_evidence_support_corpus_eval.py --specs ../05_TEST/EVIDENCE_SUPPORT_FACT_SPECS_V1.json --ci-notice
          python rag_evidence_support_corpus_eval.py --specs ../05_TEST/EVIDENCE_SUPPORT_FACT_SPECS_V2.json --ci-notice

      - name: Labeled retrieval evaluation (baseline gate, fails CI if below baseline)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: python rag_eval.py

      - name: Grounded-abstention diagnostic (report-only; strict gate unchanged)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: python ../05_TEST/grounded_abstention_eval.py | tee ../06_EVIDENCE/grounded_abstention_diagnostic.json

      - name: Manifest V4 + Ka V3 corpus-aligned evaluation (independent gate)
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: python rag_eval.py --eval-set ../05_TEST/EVAL_SET_CORPUS_V4_V3.json --diagnostics

      - name: Controlled retrieval experiment sweep
        working-directory: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE
        run: python rag_experiment.py > rag_experiment_results.json

      - name: Upload controlled experiment results
        uses: actions/upload-artifact@v4
        with:
          name: work-103-retrieval-experiment-py${{ matrix.python-version }}
          path: work/103/ROOM-HOP-RAG-RETRIEVAL-CAPABILITY/04_CODE/rag_experiment_results.json
          if-no-files-found: error
          retention-days: 30
