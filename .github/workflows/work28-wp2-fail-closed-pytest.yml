name: Work 28 WP2 fail-closed pytest

on:
  push:
    branches:
      - work/28-mcp-tooling-platform
    paths:
      - "work/28/MCP-8020-TOOLING-PLATFORM/10_AI_DEBUG_HANDOFF/**"
      - ".github/workflows/work28-wp2-fail-closed-pytest.yml"
  pull_request:
    paths:
      - "work/28/MCP-8020-TOOLING-PLATFORM/10_AI_DEBUG_HANDOFF/**"
      - ".github/workflows/work28-wp2-fail-closed-pytest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp2-fail-closed-pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run WP2 fail-closed regression tests
        working-directory: work/28/MCP-8020-TOOLING-PLATFORM
        env:
          PYTHONPATH: 10_AI_DEBUG_HANDOFF/02_PATCH_CANDIDATES/20261030_WP2_SUSPENDED_SPAWN
        run: python -m pytest -q 10_AI_DEBUG_HANDOFF/03_VALIDATION/test_process_job_fail_closed_review.py
