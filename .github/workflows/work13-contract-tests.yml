name: Work 13 Contract Boundary Tests

on:
  push:
    branches:
      - work/13-execution-host-hardening
    paths:
      - "execution_host/work28_contract.py"
      - "tests/test_work28_contract.py"
      - "execution_host/work28_snapshot_runner_v1.py"
      - "tests/test_work28_snapshot_runner_v1.py"
      - ".github/workflows/work13-contract-tests.yml"
  pull_request:
    paths:
      - "execution_host/work28_contract.py"
      - "tests/test_work28_contract.py"
      - "execution_host/work28_snapshot_runner_v1.py"
      - "tests/test_work28_snapshot_runner_v1.py"
      - ".github/workflows/work13-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Run Work 13 / Work 28 boundary tests
        run: python -m pytest -q tests/test_work28_contract.py tests/test_work28_snapshot_runner_v1.py
