# Work 98 - ONT Care E2E Automatic CI
name: W98 ONT Care CI

on:
  push:
    branches: [work/98-ont-care]
  pull_request:
    branches: [work/98-ont-care]
  workflow_dispatch:

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: work/98/ONT-CARE/04_CODE/ont-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/98/ONT-CARE/04_CODE/ont-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Python + Playwright (Chromium)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # NOTE (verified locally 2026-10-15): `node .output/server/index.mjs` is a
      # Cloudflare-module worker (exports fetch, no listener) and srvx fails on
      # Node 20 ("Cannot set property ip of Request"). The reliable way to serve
      # this production build is wrangler dev with nodejs_compat. Exit code is
      # propagated explicitly (no tee-pipeline masking); a Python traceback also
      # fails the step because we check both $PIPESTATUS[0] and FAIL grep.
      - name: Install wrangler
        run: npm install --no-save wrangler

      - name: Start production build server (wrangler preview of CF target)
        working-directory: work/98/ONT-CARE/04_CODE/ont-platform
        run: |
          set -euo pipefail
          cat > /tmp/ci-wrangler.toml <<EOF
          name = "w98-ci-preview"
          compatibility_date = "2026-01-01"
          compatibility_flags = ["nodejs_compat"]
          main = "$GITHUB_WORKSPACE/work/98/ONT-CARE/04_CODE/ont-platform/.output/server/index.mjs"
          assets = { directory = "$GITHUB_WORKSPACE/work/98/ONT-CARE/04_CODE/ont-platform/.output/public", binding = "assets" }
          EOF
          npx wrangler dev --config /tmp/ci-wrangler.toml --port 8080 --ip 0.0.0.0 > server.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8080/; then echo "Server up after \${i}s"; exit 0; fi
            sleep 1
          done
          echo "Server failed to start"; tail -50 server.log; exit 1

      - name: Run deep-link E2E suite (real browser, production build)
        working-directory: work/98/ONT-CARE/04_CODE/ont-platform
        env:
          BASE: http://localhost:8080
        run: |
          set -uo pipefail
          rc=0
          python3 ../../05_TEST/e2e/deep_links_e2e.py | tee e2e-output.txt || rc=$?
          py_rc=${PIPESTATUS[0]}
          echo "python exit=$py_rc pipeline exit=$rc"
          if [ "$py_rc" -ne 0 ] || [ "$rc" -ne 0 ]; then echo "E2E RUNNER FAILED (exit $py_rc)"; exit 1; fi
          if grep -q "FAIL" e2e-output.txt; then echo "E2E FAIL cases present"; exit 1; fi
          grep -q "0 failure(s)" e2e-output.txt || { echo "E2E summary line missing"; exit 1; }
          echo "E2E PASS: all deep-link cases ok on production build"

      - name: Report results
        if: always()
        run: |
          {
            echo "## W98 ONT Care E2E results"
            echo ""
            echo '```'
            cat e2e-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w98-e2e-evidence
          path: |
            work/98/ONT-CARE/04_CODE/ont-platform/e2e-output.txt
            work/98/ONT-CARE/04_CODE/ont-platform/server.log
          if-no-files-found: ignore
