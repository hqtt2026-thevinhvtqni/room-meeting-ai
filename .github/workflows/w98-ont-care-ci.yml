# Work 98 - ONT Care E2E Automatic CI
name: W98 ONT Care CI

on:
  push:
    branches: [work/98-ont-care]
  pull_request:
    branches: [work/98-ont-care]
  workflow_dispatch:

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: work/98/ONT-CARE/04_CODE/ont-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/98/ONT-CARE/04_CODE/ont-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Python + Playwright (Chromium)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Start production build server
        working-directory: work/98/ONT-CARE/04_CODE/ont-platform
        run: |
          set -euo pipefail
          PORT=8080 nohup node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/; then echo "Server up"; exit 0; fi
            sleep 1
          done
          echo "Server failed to start"; cat server.log; exit 1

      - name: Run deep-link E2E suite (real browser, production build)
        working-directory: work/98/ONT-CARE/04_CODE/ont-platform
        env:
          BASE: http://localhost:8080
        run: |
          set -euo pipefail
          python3 ../../05_TEST/e2e/deep_links_e2e.py | tee e2e-output.txt
          if grep -q "FAIL" e2e-output.txt; then echo "E2E FAIL cases present"; exit 1; fi
          echo "E2E PASS: all deep-link cases ok on production build"

      - name: Report results
        if: always()
        run: |
          {
            echo "## W98 ONT Care E2E results"
            echo ""
            echo '```'
            cat e2e-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w98-e2e-evidence
          path: |
            work/98/ONT-CARE/04_CODE/ont-platform/e2e-output.txt
            work/98/ONT-CARE/04_CODE/ont-platform/server.log
          if-no-files-found: ignore
