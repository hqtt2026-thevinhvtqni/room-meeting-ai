name: W300 TSC Debug (temporary)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/w300-tsc-debug.yml"
      - "work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w300-tsc-debug
  cancel-in-progress: true

jobs:
  tsc-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: work/300/ROOM-HOP-AI-CREATIVE-SERVICE/05_BUILD/04_CODE/dashboard
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check (capture output)
        run: |
          set +e
          bunx tsc --noEmit --pretty false > "$GITHUB_WORKSPACE/tsc-debug-out.txt" 2>&1
          code=$?
          echo "tsc exit=$code"
          cat "$GITHUB_WORKSPACE/tsc-debug-out.txt"
          echo "TSC_EXIT=$code" >> "$GITHUB_ENV"

      - name: Commit tsc output as evidence
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "TSC CLEAN" > tsc-debug-out.txt
          git config user.name "vibe-debug-bot"
          git config user.email "hqtt2026@gmail.com"
          git add tsc-debug-out.txt
          git commit -m "chore(w300): tsc clean evidence (temporary debug workflow)"
          git push
