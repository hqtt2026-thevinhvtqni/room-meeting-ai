name: Work 10 Cross-Platform Verification

on:
  push:
    branches:
      - work/10-computer-agent-mirror
      - work-10-sandbox-handoff-20261006
    paths:
      - "10/COMPUTER-AGENT/**"
      - ".github/workflows/work10-real-browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 10/COMPUTER-AGENT/requirements.txt

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 10/COMPUTER-AGENT/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 10/COMPUTER-AGENT/requirements.txt
          python -m playwright install chromium

      - name: Host inventory
        run: |
          python -c "import json,platform,sys; print(json.dumps({'python':sys.version,'platform':platform.platform(),'system':platform.system(),'release':platform.release(),'version':platform.version(),'machine':platform.machine()},indent=2))"

      - name: Syntax check
        run: |
          python -m compileall -q 10/COMPUTER-AGENT/04_CODE 10/COMPUTER-AGENT/05_TEST

      - name: PowerShell launcher syntax (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            "10/COMPUTER-AGENT/05_TEST/START_WORK10_LOCAL.ps1",
            "10/COMPUTER-AGENT/05_TEST/STOP_WORK10_LOCAL.ps1",
            "10/COMPUTER-AGENT/05_TEST/RUN_WORK10_ACCEPTANCE.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax validation failed: $file"
            }
            Write-Host "PASS PowerShell syntax: $file"
          }

      - name: Local launcher smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workRoot = (Resolve-Path "10/COMPUTER-AGENT").Path
          & "10/COMPUTER-AGENT/05_TEST/START_WORK10_LOCAL.ps1" -WorkRoot $workRoot -PythonPath (Get-Command python).Source -NoClipboard -NoOpenBrowser
          try {
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 5
            if ([string]$health.work_id -ne "10") { throw "Launcher health Work ID mismatch" }
            $dashboard = Invoke-WebRequest -Uri "http://127.0.0.1:3010/" -UseBasicParsing -TimeoutSec 5
            if ($dashboard.StatusCode -ne 200) { throw "Launcher Dashboard did not return HTTP 200" }
            Write-Host "PASS local Work 10 launcher API + Dashboard smoke"
          } finally {
            & "10/COMPUTER-AGENT/05_TEST/STOP_WORK10_LOCAL.ps1" -WorkRoot $workRoot
          }

      - name: Real Chromium E2E
        run: |
          python 10/COMPUTER-AGENT/05_TEST/e2e_real_browser.py

      - name: Offline, safety, HTTP and containment regression suites
        if: always()
        run: |
          python 10/COMPUTER-AGENT/05_TEST/run_all_tests.py

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work10-evidence-${{ runner.os }}
          path: |
            10/COMPUTER-AGENT/06_EVIDENCE/offline-test-evidence.json
            10/COMPUTER-AGENT/06_EVIDENCE/test-logs/*.log
            10/COMPUTER-AGENT/06_EVIDENCE/real-browser-e2e-result.json
            10/COMPUTER-AGENT/06_EVIDENCE/real-browser-e2e.png
            10/COMPUTER-AGENT/06_EVIDENCE/process-runs/*.json
            10/COMPUTER-AGENT/06_EVIDENCE/computer-agent-owner-state.json
          if-no-files-found: warn
          retention-days: 14
