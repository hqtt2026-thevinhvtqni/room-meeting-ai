# Pytest configuration for the Work 15 Website Builder backend foundation.
#
# Kept separate from the repository-root pytest.ini (which governs the
# ROOM-HOP Core suite) because this is a nested workspace with its own
# source tree: src/backend. Run from this directory:
#
#     python -m pytest tests/backend -q
#
[pytest]
pythonpath = src/backend
norecursedirs = .* build dist node_modules __pycache__ src/frontend
testpaths = tests
